<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>案例 B · 交付实现 · 智慧园区能耗与碳排驾驶舱</title>

  <!-- ==========================================================================
    CASE B — DELIVERED SCREEN (step ④ 实现)
    --------------------------------------------------------------------------
    Provenance  rewritten from design/prototype-t4-energy.html, which was selected
                in design/decision.md (T4 KPI 主导, 6/6, KPI row 208).
    Canvas      1920 x 1080 contain, header 104 / KPI 208 / main minmax(0,1fr)
    Tokens      every size is a --dvk-screen-* reference; every colour derives
                from --dvk-color-* on the single .dvk-theme-solar-gold class
    States      four exception states (design-rules 6.6) wired to a demo control
                outside the canvas: 实时 / 加载中 / 无数据 / 失败 / 陈旧.
                Stale keeps the last values visible and adds the last-update time
                (design-rules 6.7).
    ========================================================================== -->

  <link rel="stylesheet" href="../../../../skills/datav-kit/assets/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/solar-gold.css">

  <script type="importmap">
    {
      "imports": {
        "@datav-kit/elements@0.0.5": "https://cdn.jsdelivr.net/npm/@datav-kit/elements@0.0.5/+esm"
      }
    }
  </script>
  <!-- CDN backup if jsDelivr +esm is unavailable:
       "@datav-kit/elements@0.0.5": "https://esm.sh/@datav-kit/elements@0.0.5" -->

  <style>
    html {
      color-scheme: dark;
      background-color: var(--dvk-page-ground, var(--dvk-color-surface));
    }

    body { margin: 0; min-height: 100vh; font-family: var(--dvk-screen-font-family); }

    .dvk-screen {
      --dvk-text-strong: var(--dvk-color-primary);
      --dvk-text-muted: color-mix(in srgb, var(--dvk-color-primary) 64%, transparent);
      --dvk-text-faint: color-mix(in srgb, var(--dvk-color-primary) 38%, transparent);
      --dvk-rule: color-mix(in srgb, var(--dvk-color-primary) 20%, transparent);
      --dvk-fill-soft: color-mix(in srgb, var(--dvk-color-primary) 12%, transparent);
      --dvk-surface-fill: color-mix(in srgb, var(--dvk-color-surface) 88%, transparent);

      position: relative;
      box-sizing: border-box;
      width: 1920px;
      height: 1080px;
      padding: var(--dvk-screen-safe-margin);
      display: grid;
      grid-template-rows:
        var(--dvk-screen-header-height)
        calc(var(--dvk-screen-kpi-height) * 2)
        minmax(0, 1fr);
      gap: var(--dvk-screen-space-xl);
      color: var(--dvk-text-muted);
      font-size: var(--dvk-screen-font-size-xs);
      line-height: var(--dvk-screen-line-height-base);
      overflow: hidden;
    }

    .unit { font-size: var(--dvk-screen-font-size-sm); color: var(--dvk-text-faint); }

    /* ---------- P2 header + P3 compact title (T4 replacement) ---------- */
    .screen-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: var(--dvk-screen-space-xl);
      min-height: 0;
      border-bottom: var(--dvk-line-width) solid var(--dvk-rule);
    }

    .header-info {
      display: grid;
      gap: var(--dvk-screen-space-xs);
      padding: var(--dvk-screen-space-lg) var(--dvk-screen-space-xl);
      border-left: 4px solid var(--dvk-color-accent);
      background: var(--dvk-surface-fill);
    }

    .header-info--right {
      justify-self: end;
      text-align: right;
      border-left: 0;
      border-right: 4px solid var(--dvk-color-secondary);
    }

    .header-info .label { font-size: var(--dvk-screen-font-size-xs); line-height: 1; color: var(--dvk-text-faint); letter-spacing: 0.12em; }
    .header-info .value { font-size: var(--dvk-screen-font-size-sm); font-weight: var(--dvk-screen-font-weight-medium); line-height: 1.2; color: var(--dvk-text-strong); }

    .title-compact { text-align: center; }
    .title-compact .eyebrow { display: block; font-size: var(--dvk-screen-font-size-xs); line-height: 1.2; letter-spacing: 0.24em; color: var(--dvk-text-faint); }
    .title-compact h1 { margin: var(--dvk-screen-space-xs) 0 0; font-size: var(--dvk-screen-font-size-xl); font-weight: var(--dvk-screen-font-weight-bold); line-height: 1.1; color: var(--dvk-text-strong); }

    /* ---------- P4 enlarged KPI strip (6 cards) ---------- */
    .kpi-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--dvk-screen-space-xl); min-height: 0; }
    .kpi-strip > dvk-border-box-15 { min-width: 0; min-height: 0; }

    .kpi-card { display: grid; align-content: center; gap: var(--dvk-screen-space-xs); height: 100%; }
    .kpi-card .label { font-size: var(--dvk-screen-font-size-xs); line-height: 1.2; color: var(--dvk-text-muted); }
    .kpi-card .caption { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-faint); }
    .value-row { display: flex; align-items: baseline; gap: var(--dvk-screen-space-sm); }

    /* P14 construction at the enlarged strip size: 44px, not the hero 56px
       (the hero size is a one-per-screen metric exception, reserved by P14). */
    .kpi-card dvk-count-to {
      --dvk-count-to-font-size: var(--dvk-screen-font-size-xl);
      --dvk-count-to-color: var(--dvk-text-strong);
    }

    /* ---------- P5 main grid: 6 / 6 ---------- */
    .screen-main {
      display: grid;
      grid-template-columns: repeat(var(--dvk-screen-grid-columns), minmax(0, 1fr));
      gap: var(--dvk-screen-grid-gutter);
      min-height: 0;
    }

    .col { display: grid; min-height: 0; }
    .col > * { min-height: 0; }
    .col-left { grid-column: span 6; }
    .col-right { grid-column: span 6; }

    /* ---------- P6 + P7 ---------- */
    .panel-inner { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: var(--dvk-screen-space-lg); height: 100%; min-height: 0; }
    dvk-border-box-9 .panel-inner,
    dvk-border-box-15 .panel-inner,
    .kpi-card { padding: 0 var(--dvk-screen-space-lg); }

    .panel-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--dvk-screen-space-md); }
    .panel-heading .eyebrow { margin: 0; font-size: var(--dvk-screen-font-size-sm); line-height: 1.2; color: var(--dvk-text-faint); letter-spacing: 0.14em; }
    .panel-heading h3 { margin: 0; font-size: var(--dvk-screen-font-size-md); font-weight: var(--dvk-screen-font-weight-bold); line-height: 1.2; color: var(--dvk-text-strong); }
    .chip { flex: 0 0 auto; padding: 5px 9px; border: var(--dvk-line-width) solid var(--dvk-rule); font-size: var(--dvk-screen-font-size-xs); line-height: 1.2; color: var(--dvk-color-accent); background: var(--dvk-fill-soft); }
    .panel-body { min-height: 0; overflow: hidden; }

    /* ---------- P9 progress rows ---------- */
    .progress-list { display: grid; gap: var(--dvk-screen-space-lg); align-content: start; }
    .progress-line { display: grid; gap: var(--dvk-screen-space-sm); }
    .progress-line .row-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--dvk-screen-space-md); }
    .progress-line .label { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-muted); }
    .bar { height: 8px; overflow: hidden; background: var(--dvk-fill-soft); }
    .bar > i { display: block; width: var(--bar-value); height: 100%; background: linear-gradient(90deg, var(--dvk-color-secondary), var(--dvk-color-primary)); }

    /* ---------- P10 rank / pressure row ---------- */
    .rank-list { display: grid; gap: var(--dvk-screen-space-md); align-content: start; }
    .rank-row {
      display: grid;
      grid-template-columns: minmax(0, 150px) minmax(0, 1fr);
      align-items: center;
      gap: var(--dvk-screen-space-md);
      padding: var(--dvk-screen-space-md) var(--dvk-screen-space-lg);
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background: var(--dvk-surface-fill);
    }

    .rank-row .name-zone { display: flex; align-items: baseline; gap: var(--dvk-screen-space-sm); min-width: 0; white-space: nowrap; }
    .rank-row .code { font-size: var(--dvk-screen-font-size-md); font-weight: var(--dvk-screen-font-weight-bold); line-height: 1.2; color: var(--dvk-text-strong); }
    .rank-row .name { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-muted); overflow: hidden; text-overflow: ellipsis; }
    .rank-row .status { justify-self: end; font-style: normal; font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-color-accent); }
    .rank-row .bar { grid-column: 1 / -1; }

    /* ---------- four exception states (design-rules 6.6) ---------- */
    .screen-main { position: relative; }
    .state-layer {
      position: absolute;
      inset: 0;
      z-index: var(--dvk-screen-z-overlay);
      display: grid;
      place-items: center;
      font-size: var(--dvk-screen-font-size-md);
      color: var(--dvk-text-muted);
      background: color-mix(in srgb, var(--dvk-color-surface) 72%, transparent);
    }

    .state-layer[data-state="failed"] { color: var(--dvk-color-accent); }
    .state-layer[data-state="stale"] { place-items: start end; padding: var(--dvk-screen-space-md); background: transparent; color: var(--dvk-color-accent); }

    /* ---------- demo-only state control (outside the 1920x1080 canvas) ---------- */
    .demo-controls {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background: var(--dvk-surface-fill);
      font-size: var(--dvk-screen-font-size-xs);
    }

    .demo-controls button {
      padding: 4px 10px;
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background: transparent;
      color: var(--dvk-text-muted);
      font: inherit;
      cursor: pointer;
    }

    .demo-controls button.is-active { color: var(--dvk-text-strong); background: var(--dvk-fill-soft); }
  </style>
</head>

<body>
  <!-- Demo-only control: exercises the four exception states outside the canvas. -->
  <div class="demo-controls" role="group" aria-label="异常态演示">
    <span>STATE</span>
    <button type="button" data-state="ready">实时</button>
    <button type="button" data-state="loading">加载中</button>
    <button type="button" data-state="empty">无数据</button>
    <button type="button" data-state="failed">失败</button>
    <button type="button" data-state="stale">陈旧</button>
  </div>

  <dvk-fit-screen width="1920" height="1080" mode="contain" align="center center" fit-target="viewport">
    <div class="dvk-screen dvk-theme-solar-gold" id="screen">

      <header class="screen-header">
        <div class="header-info">
          <span class="label">SITE</span>
          <strong class="value" data-bind="header.site"></strong>
        </div>
        <div class="title-compact">
          <span class="eyebrow" data-bind="header.eyebrow"></span>
          <h1 data-bind="header.title"></h1>
        </div>
        <div class="header-info header-info--right">
          <span class="label">UPDATED</span>
          <strong class="value" data-bind="header.updated"></strong>
        </div>
      </header>

      <section class="kpi-strip" id="kpi-strip" aria-label="KPI"></section>

      <main class="screen-main" id="main">
        <div class="col col-left">
          <dvk-border-box-9 background-color="var(--dvk-color-surface)">
            <div class="panel-inner">
              <header class="panel-heading">
                <div>
                  <p class="eyebrow">ENERGY MIX</p>
                  <h3>能耗构成</h3>
                </div>
                <span class="chip">今日</span>
              </header>
              <div class="panel-body"><div class="progress-list" id="mix-list"></div></div>
            </div>
          </dvk-border-box-9>
        </div>

        <div class="col col-right">
          <dvk-border-box-9 background-color="var(--dvk-color-surface)">
            <div class="panel-inner">
              <header class="panel-heading">
                <div>
                  <p class="eyebrow">SUB-METER</p>
                  <h3>分项能耗</h3>
                </div>
                <span class="chip">TOP 5</span>
              </header>
              <div class="panel-body"><div class="rank-list" id="submeter-list"></div></div>
            </div>
          </dvk-border-box-9>
        </div>
        <div class="state-layer" id="screen-layer" role="status" hidden></div>
      </main>
    </div>
  </dvk-fit-screen>

  <script type="application/json" id="dvk-data">
    {
      "header": {
        "eyebrow": "CAMPUS ENERGY & CARBON",
        "title": "智慧园区能耗与碳排驾驶舱",
        "site": "园区 A · 12 栋楼宇",
        "updated": "14:32:05"
      },
      "kpi": [
        { "label": "今日总能耗", "value": 12846, "unit": "kWh", "caption": "较昨日 -2.1%" },
        { "label": "峰段最大负荷", "value": 1862, "unit": "kW", "caption": "14:00–15:00" },
        { "label": "光伏发电量", "value": 3210, "unit": "kWh", "caption": "占用电 25.0%" },
        { "label": "碳排强度", "value": 0.42, "unit": "tCO₂e/MWh", "caption": "较基准 -8.6%", "decimals": 2 },
        { "label": "空调能耗占比", "value": 41.5, "unit": "%", "caption": "环比 +1.2%", "decimals": 1 },
        { "label": "储能 SOC", "value": 68, "unit": "%", "caption": "充电中 42kW" }
      ],
      "mix": [
        { "label": "空调", "value": 41.5, "unit": "%" },
        { "label": "照明插座", "value": 23.8, "unit": "%" },
        { "label": "动力设备", "value": 19.4, "unit": "%" },
        { "label": "电梯", "value": 6.2, "unit": "%" },
        { "label": "数据中心", "value": 5.4, "unit": "%" },
        { "label": "其他", "value": 3.7, "unit": "%" }
      ],
      "submeter": [
        { "code": "A3", "name": "研发楼 A3", "status": "偏高", "value": 88 },
        { "code": "B1", "name": "厂房 B1", "status": "正常", "value": 74 },
        { "code": "C2", "name": "宿舍 C2", "status": "正常", "value": 61 },
        { "code": "D4", "name": "数据中心 D4", "status": "正常", "value": 55 },
        { "code": "E1", "name": "食堂 E1", "status": "偏低", "value": 38 }
      ]
    }
  </script>

  <script type="module">
    import { register } from '@datav-kit/elements@0.0.5'

    const COUNT_DURATION = 1400
    const data = JSON.parse(document.querySelector('#dvk-data').textContent)
    const screen = document.querySelector('#screen')
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches

    register()

    function renderKpi() {
      document.querySelector('#kpi-strip').innerHTML = data.kpi.map(item => `
        <dvk-border-box-15 background-color="var(--dvk-color-surface)">
          <div class="kpi-card">
            <span class="label">${item.label}</span>
            <span class="value-row">
              <dvk-count-to end-val="${item.value}" decimals="${item.decimals ?? 0}" duration="${COUNT_DURATION}"></dvk-count-to>
              <span class="unit">${item.unit}</span>
            </span>
            <span class="caption">${item.caption}</span>
          </div>
        </dvk-border-box-15>`).join('')
    }

    function renderMix() {
      document.querySelector('#mix-list').innerHTML = data.mix.map(item => `
        <div class="progress-line">
          <span class="row-head">
            <span class="label">${item.label}</span>
            <span class="value-row">
              <dvk-count-to end-val="${item.value}" decimals="1" duration="${COUNT_DURATION}"></dvk-count-to>
              <span class="unit">${item.unit}</span>
            </span>
          </span>
          <div class="bar"><i style="--bar-value: ${item.value}%"></i></div>
        </div>`).join('')
    }

    function renderSubmeter() {
      document.querySelector('#submeter-list').innerHTML = data.submeter.map(item => `
        <article class="rank-row">
          <span class="name-zone">
            <strong class="code">${item.code}</strong>
            <span class="name">${item.name}</span>
          </span>
          <em class="status">${item.status}</em>
          <div class="bar"><i style="--bar-value: ${item.value}%"></i></div>
        </article>`).join('')
    }

    function bindStaticText() {
      document.querySelectorAll('[data-bind]').forEach((el) => {
        const path = el.dataset.bind.split('.')
        el.textContent = path.reduce((node, key) => node[key], data)
      })
    }

    const STATE_TEXT = { ready: '实时', loading: '加载中', empty: '暂无数据', failed: '数据获取失败', stale: `陈旧 · ${data.header.updated}` }
    const layer = document.querySelector('#screen-layer')
    const main = document.querySelector('#main')

    /* Four exception states (design-rules 6.6); stale keeps the last data visible. */
    function setState(state) {
      layer.hidden = state === 'ready'
      layer.dataset.state = state
      layer.textContent = state === 'ready' ? '' : STATE_TEXT[state]
      layer.setAttribute('role', state === 'failed' ? 'alert' : 'status')
      main.style.outline = state === 'stale' ? '1px dashed var(--dvk-color-accent)' : ''
      document.querySelectorAll('.demo-controls button[data-state]').forEach((button) => {
        button.classList.toggle('is-active', button.dataset.state === state)
      })
    }

    function applyReducedMotion() {
      if (!reduceMotion) return
      document.querySelectorAll('dvk-count-to').forEach(el => el.setAttribute('disabled', ''))
    }

    bindStaticText()
    renderKpi()
    renderMix()
    renderSubmeter()

    function boot() {
      document.documentElement.style.setProperty(
        '--dvk-page-ground',
        getComputedStyle(screen).getPropertyValue('--dvk-color-surface').trim(),
      )
      applyReducedMotion()
      setState('ready')
    }

    if (document.readyState === 'complete') boot()
    else window.addEventListener('load', boot, { once: true })

    document.querySelectorAll('.demo-controls button[data-state]').forEach((button) => {
      button.addEventListener('click', () => setState(button.dataset.state))
    })
  </script>
</body>
</html>
