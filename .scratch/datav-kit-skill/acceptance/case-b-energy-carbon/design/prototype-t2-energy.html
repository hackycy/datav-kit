<head>

  <title>案例 B · 候选原型 2 · T2 两栏分析改写（园区能耗与碳排）</title>

  <!-- ==========================================================================
    DECLARATION 1/4 — SKELETON (rows / 12-column spans / fluid row heights)
    --------------------------------------------------------------------------
    Canvas     1920 x 1080, mode="contain", align="center center"   (P1)
    Rows       header var(--dvk-screen-header-height) 104 / KPI 104 / main minmax(0,1fr)
    Main       12 columns x minmax(0, 1fr), gutter var(--dvk-screen-grid-gutter) 24
               main span 8   rows repeat(2, minmax(0, 1fr))  two chart slots
               side span 4   rows repeat(2, minmax(0, 1fr))  ranking + metric stack
    Fluid      every main-region row is minmax(0, ...) and every column and panel
               carries min-height: 0 — no fixed px row can clip content.
    ========================================================================== -->

  <!-- ==========================================================================
    DECLARATION 2/4 — BLOCK LIST (pattern references)
    --------------------------------------------------------------------------
    header      P2 three-part header + P3 title bar (feature-detected)
    KPI row     P4 KPI strip, 4 cards
    main  1     P6+P7+chart slot 1   load curve: line-area, two series
    main  2     P6+P7+chart slot 2   energy source: pie-doughnut, four categories
    side  1     P6+P7+P10            sub-meter energy ranking
    side  2     P6+P7+P15            metric stack
    metrics     P16                  dvk-count-to for every animating number
    Both chart slots carry a real ECharts instance (SVG renderer) — neither is empty.
    ========================================================================== -->

  <!-- ==========================================================================
    DECLARATION 3/4 — COMPONENT CONSTRUCTION (tag + key attributes)
    --------------------------------------------------------------------------
    dvk-fit-screen      width="1920" height="1080" mode="contain"
                        align="center center" fit-target="viewport"
    dvk-border-box-15   KPI cards + metric stack + both chart frames
                        background-color="var(--dvk-color-surface)"
    dvk-border-box-9    ranking panel (restrained static surface role)
                        background-color="var(--dvk-color-surface)"
    dvk-decoration-9    P3 fallback title rails (reverse on the left instance)
    dvk-count-to        end-val / decimals / duration="1400" (P16: one duration per
                        screen), disabled under prefers-reduced-motion: reduce
    echarts             init(el, themeObject, { renderer: 'svg' }); theme object built
                        from --dvk-color-* / --dvk-line-width / --dvk-screen-font-size-*
                        read off .dvk-screen; animation 300ms; ResizeObserver + rAF
                        throttled chart.resize(); explicit grid override; no
                        over-smoothing; pie categories <= 5
    Panel titles live inside the default slot (P7 .panel-heading) — no border box has
    a #header or #title slot. title-4 does not exist and is never referenced.
    ========================================================================== -->

  <!-- ==========================================================================
    DECLARATION 4/4 — PLACEHOLDER DATA SHAPE (inline JSON, #dvk-data)
    --------------------------------------------------------------------------
    {
      "header": { "eyebrow": string, "title": string, "site": string,
                  "updated": string },
      "kpi":    [ { "label": string, "value": number, "unit": string,
                    "decimals": number? } ] x4,
      "load":   { "labels": [ string ] x12,
                  "series": [ { "name": string, "data": [ number ] x12 } ] x2 },
      "source": { "items": [ { "name": string, "value": number } ] x4 },
      "submeter": [ { "code": string, "name": string, "status": string,
                      "value": number } ] x3,
      "metrics": [ { "label": string, "value": number, "unit": string,
                     "decimals": number? } ] x2
    }
    ========================================================================== -->

  <!-- ==========================================================================
    PERMISSION TIERS (issue 08 §3 — three tiers, unchanged by this file)
    --------------------------------------------------------------------------
    skeleton redline (change sends the work back to the prototype):
      row count, column count, primary-view position, header form, block add/remove
    recommended values (changeable, must be registered as a deviation):
      block proportions, spacing, density, decoration strength, theme
    free zone (changeable inside a block):
      pattern substitution, business copy, chart type and option, placeholder data
    ========================================================================== -->

      "imports": {

  <style>
    html {
      color-scheme: dark;
      background-color: var(--dvk-page-ground, var(--dvk-color-surface));
    }

    body { margin: 0; min-height: 100vh; font-family: var(--dvk-screen-font-family); }

    .dvk-screen {
      --dvk-text-strong: var(--dvk-color-primary);
      --dvk-text-muted: color-mix(in srgb, var(--dvk-color-primary) 64%, transparent);
      --dvk-text-faint: color-mix(in srgb, var(--dvk-color-primary) 38%, transparent);
      --dvk-rule: color-mix(in srgb, var(--dvk-color-primary) 20%, transparent);
      --dvk-fill-soft: color-mix(in srgb, var(--dvk-color-primary) 12%, transparent);
      --dvk-surface-fill: color-mix(in srgb, var(--dvk-color-surface) 88%, transparent);

      position: relative;
      box-sizing: border-box;
      width: 1920px;
      height: 1080px;
      padding: var(--dvk-screen-safe-margin);
      display: grid;
      grid-template-rows:
        var(--dvk-screen-header-height)
        var(--dvk-screen-kpi-height)
        minmax(0, 1fr);
      gap: var(--dvk-screen-space-xl);
      color: var(--dvk-text-muted);
      font-size: var(--dvk-screen-font-size-xs);
      line-height: var(--dvk-screen-line-height-base);
      overflow: hidden;
    }

    .unit { font-size: var(--dvk-screen-font-size-sm); color: var(--dvk-text-faint); }

    /* ---------- P2 header + P3 title bar ---------- */
    .screen-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: var(--dvk-screen-space-xl);
      min-height: 0;
      border-bottom: var(--dvk-line-width) solid var(--dvk-rule);
    }

    .header-info {
      display: grid;
      gap: var(--dvk-screen-space-xs);
      padding: var(--dvk-screen-space-lg) var(--dvk-screen-space-xl);
      border-left: 4px solid var(--dvk-color-accent);
      background: var(--dvk-surface-fill);
    }

    .header-info--right {
      justify-self: end;
      text-align: right;
      border-left: 0;
      border-right: 4px solid var(--dvk-color-secondary);
    }

    .header-info .label { font-size: var(--dvk-screen-font-size-xs); line-height: 1; color: var(--dvk-text-faint); letter-spacing: 0.12em; }
    .header-info .value { font-size: var(--dvk-screen-font-size-sm); font-weight: var(--dvk-screen-font-weight-medium); line-height: 1.2; color: var(--dvk-text-strong); }

    .title-rail { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--dvk-screen-space-xl); min-width: 720px; }
    .rail { display: block; height: 60px; opacity: 0.85; }

    .title-block {
      padding: var(--dvk-screen-space-sm) var(--dvk-screen-space-2xl);
      text-align: center;
      border-top: var(--dvk-line-width) solid var(--dvk-rule);
      border-bottom: var(--dvk-line-width) solid var(--dvk-rule);
    }

    .title-block .eyebrow { display: block; font-size: var(--dvk-screen-font-size-xs); line-height: 1.2; letter-spacing: 0.24em; color: var(--dvk-text-faint); }
    .title-block h1 { margin: var(--dvk-screen-space-xs) 0 0; font-size: var(--dvk-screen-font-size-xl); font-weight: var(--dvk-screen-font-weight-bold); line-height: 1.1; color: var(--dvk-text-strong); }

    /* ---------- P4 KPI strip ---------- */
    .kpi-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--dvk-screen-space-2xl); min-height: 0; }
    .kpi-strip > dvk-border-box-15 { min-width: 0; min-height: 0; }
    .kpi-card { display: grid; align-content: center; gap: var(--dvk-screen-space-xs); height: 100%; }
    .kpi-card .label { font-size: var(--dvk-screen-font-size-xs); line-height: 1.2; color: var(--dvk-text-muted); }
    .value-row { display: flex; align-items: baseline; gap: var(--dvk-screen-space-sm); }

    /* ---------- P5 main grid: 8 / 4 ---------- */
    .screen-main {
      display: grid;
      grid-template-columns: repeat(var(--dvk-screen-grid-columns), minmax(0, 1fr));
      gap: var(--dvk-screen-grid-gutter);
      min-height: 0;
    }

    .col { display: grid; gap: var(--dvk-screen-space-lg); min-height: 0; }
    .col > * { min-height: 0; }
    .col-main { grid-column: span 8; grid-template-rows: repeat(2, minmax(0, 1fr)); }
    .col-side { grid-column: span 4; grid-template-rows: repeat(2, minmax(0, 1fr)); }

    /* ---------- P6 + P7 ---------- */
    .panel-inner { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: var(--dvk-screen-space-lg); height: 100%; min-height: 0; }
    dvk-border-box-9 .panel-inner,
    dvk-border-box-15 .panel-inner,
    .kpi-card { padding: 0 var(--dvk-screen-space-lg); }

    .panel-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--dvk-screen-space-md); }
    .panel-heading .eyebrow { margin: 0; font-size: var(--dvk-screen-font-size-sm); line-height: 1.2; color: var(--dvk-text-faint); letter-spacing: 0.14em; }
    .panel-heading h3 { margin: 0; font-size: var(--dvk-screen-font-size-md); font-weight: var(--dvk-screen-font-weight-bold); line-height: 1.2; color: var(--dvk-text-strong); }
    .chip { flex: 0 0 auto; padding: 5px 9px; border: var(--dvk-line-width) solid var(--dvk-rule); font-size: var(--dvk-screen-font-size-xs); line-height: 1.2; color: var(--dvk-color-accent); background: var(--dvk-fill-soft); }
    .panel-body { min-height: 0; overflow: hidden; }
    .chart-slot { width: 100%; height: 100%; min-height: 0; }

    /* ---------- P10 rank / pressure row ---------- */
    .rank-list { display: grid; gap: var(--dvk-screen-space-md); align-content: start; }
    .rank-row {
      display: grid;
      grid-template-columns: minmax(0, 150px) minmax(0, 1fr);
      align-items: center;
      gap: var(--dvk-screen-space-md);
      padding: var(--dvk-screen-space-md) var(--dvk-screen-space-lg);
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background: var(--dvk-surface-fill);
    }

    .rank-row .name-zone { display: flex; align-items: baseline; gap: var(--dvk-screen-space-sm); min-width: 0; white-space: nowrap; }
    .rank-row .code { font-size: var(--dvk-screen-font-size-md); font-weight: var(--dvk-screen-font-weight-bold); line-height: 1.2; color: var(--dvk-text-strong); }
    .rank-row .name { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-muted); overflow: hidden; text-overflow: ellipsis; }
    .rank-row .status { justify-self: end; font-style: normal; font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-color-accent); }
    .bar { height: 8px; overflow: hidden; background: var(--dvk-fill-soft); }
    .bar > i { display: block; width: var(--bar-value); height: 100%; background: linear-gradient(90deg, var(--dvk-color-secondary), var(--dvk-color-primary)); }
    .rank-row .bar { grid-column: 1 / -1; }

    /* ---------- P15 metric stack ---------- */
    .metric-stack { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: var(--dvk-screen-space-md); height: 100%; min-height: 0; }
    .metric-card { display: grid; align-content: center; gap: var(--dvk-screen-space-xs); padding: var(--dvk-screen-space-md) var(--dvk-screen-space-lg); border: var(--dvk-line-width) solid var(--dvk-rule); min-height: 0; }
    .metric-card .label { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-faint); }
    .metric-card dvk-count-to { --dvk-count-to-font-size: var(--dvk-screen-font-size-md); --dvk-count-to-color: var(--dvk-text-strong); }

    .kpi-card dvk-count-to { --dvk-count-to-font-size: var(--dvk-screen-font-size-lg); --dvk-count-to-color: var(--dvk-text-strong); }
  </style>
</head>

  <script type="module">
    import { register } from '@datav-kit/elements@0.0.5'
    import * as echarts from 'echarts'

    const COUNT_DURATION = 1400
    const CHART_ANIMATION = 300
    const data = JSON.parse(document.querySelector('#dvk-data').textContent)
    const screen = document.querySelector('#screen')
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
    const charts = []

    register()

    function readTokens(host) {
      const style = getComputedStyle(host)
      const value = name => style.getPropertyValue(name).trim()
      return {
        primary: value('--dvk-color-primary'),
        secondary: value('--dvk-color-secondary'),
        accent: value('--dvk-color-accent'),
        surface: value('--dvk-color-surface'),
        lineWidth: Number.parseFloat(value('--dvk-line-width')) || 1,
        fontFamily: value('--dvk-screen-font-family'),
        fontXs: Number.parseFloat(value('--dvk-screen-font-size-xs')) || 14,
        fontSm: Number.parseFloat(value('--dvk-screen-font-size-sm')) || 18,
      }
    }

    function withAlpha(color, alpha) {
      const hex = color.trim()
      if (!hex.startsWith('#')) return hex
      const rgb = hex.length === 4
        ? [1, 2, 3].map(index => Number.parseInt(hex[index] + hex[index], 16))
        : [1, 3, 5].map(index => Number.parseInt(hex.slice(index, index + 2), 16))
      return `rgba(${rgb.join(', ')}, ${alpha})`
    }

    function buildChartTheme(t) {
      const axisLabel = { color: withAlpha(t.primary, 0.72), fontSize: t.fontXs, fontFamily: t.fontFamily }
      return {
        color: [t.primary, t.secondary, t.accent],
        backgroundColor: 'transparent',
        textStyle: { color: withAlpha(t.primary, 0.72), fontFamily: t.fontFamily, fontSize: t.fontXs },
        categoryAxis: {
          axisLine: { lineStyle: { color: withAlpha(t.primary, 0.32), width: t.lineWidth } },
          axisTick: { show: false },
          axisLabel,
          splitLine: { show: false },
        },
        valueAxis: {
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel,
          splitLine: { lineStyle: { color: withAlpha(t.primary, 0.12), width: t.lineWidth } },
        },
        legend: { textStyle: { color: withAlpha(t.primary, 0.72), fontFamily: t.fontFamily, fontSize: t.fontXs } },
        tooltip: {
          backgroundColor: t.surface,
          borderColor: withAlpha(t.primary, 0.4),
          borderWidth: t.lineWidth,
          textStyle: { color: t.primary, fontSize: t.fontSm, fontFamily: t.fontFamily },
        },
      }
    }

    function mountTitle() {
      const group = document.querySelector('#title-group')
      const tag = ['dvk-title-1', 'dvk-title-2', 'dvk-title-3'].find(name => customElements.get(name))
      if (tag) {
        const el = document.createElement(tag)
        el.setAttribute('title-text', data.header.title)
        group.append(el)
        group.dataset.titlePath = 'component'
        return
      }
      const rail = document.createElement('div')
      rail.className = 'title-rail'
      rail.innerHTML = `
        <dvk-decoration-9 class="rail" reverse></dvk-decoration-9>
        <div class="title-block">
          <span class="eyebrow">${data.header.eyebrow}</span>
          <h1>${data.header.title}</h1>
        </div>
        <dvk-decoration-9 class="rail"></dvk-decoration-9>`
      group.append(rail)
      group.dataset.titlePath = 'p3-fallback'
    }

    function renderKpi() {
      document.querySelector('#kpi-strip').innerHTML = data.kpi.map(item => `
        <dvk-border-box-15 background-color="var(--dvk-color-surface)">
          <div class="kpi-card">
            <span class="label">${item.label}</span>
            <span class="value-row">
              <dvk-count-to end-val="${item.value}" decimals="${item.decimals ?? 0}" duration="${COUNT_DURATION}"></dvk-count-to>
              <span class="unit">${item.unit}</span>
            </span>
          </div>
        </dvk-border-box-15>`).join('')
    }

    function renderSubmeter() {
      document.querySelector('#submeter-list').innerHTML = data.submeter.map(item => `
        <article class="rank-row">
          <span class="name-zone">
            <strong class="code">${item.code}</strong>
            <span class="name">${item.name}</span>
          </span>
          <em class="status">${item.status}</em>
          <div class="bar"><i style="--bar-value: ${item.value}%"></i></div>
        </article>`).join('')
    }

    function renderMetrics() {
      document.querySelector('#metric-stack').innerHTML = data.metrics.map(item => `
        <article class="metric-card">
          <span class="label">${item.label}</span>
          <span class="value-row">
            <dvk-count-to end-val="${item.value}" decimals="${item.decimals ?? 0}" duration="${COUNT_DURATION}"></dvk-count-to>
            <span class="unit">${item.unit}</span>
          </span>
        </article>`).join('')
    }

    function bindStaticText() {
      document.querySelectorAll('[data-bind]').forEach((el) => {
        const path = el.dataset.bind.split('.')
        el.textContent = path.reduce((node, key) => node[key], data)
      })
    }

    function loadOption() {
      return {
        animation: !reduceMotion,
        animationDuration: CHART_ANIMATION,
        grid: { left: 64, right: 24, top: 40, bottom: 28 },
        legend: { top: 0, right: 8, itemWidth: 12, itemHeight: 8, data: data.load.series.map(series => series.name) },
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', boundaryGap: false, data: data.load.labels },
        yAxis: { type: 'value' },
        series: data.load.series.map(series => ({
          type: 'line',
          name: series.name,
          data: series.data,
          smooth: false,
          showSymbol: false,
          lineStyle: { width: 2 },
          areaStyle: { opacity: 0.16 },
        })),
      }
    }

    function sourceOption() {
      return {
        animation: !reduceMotion,
        animationDuration: CHART_ANIMATION,
        // Direct labels on the ring; no detached legend (design-rules 6.1).
        tooltip: { trigger: 'item', formatter: '{b}: {c}%' },
        series: [{
          type: 'pie',
          radius: ['58%', '75%'],
          center: ['50%', '52%'],
          avoidLabelOverlap: true,
          minAngle: 6,
          label: { show: true, formatter: '{b} {c}%', fontSize: 14 },
          labelLine: { length: 10, length2: 12 },
          data: data.source.items,
        }],
      }
    }

    function mountChart(selector, option) {
      const el = document.querySelector(selector)
      const chart = echarts.init(el, buildChartTheme(readTokens(screen)), { renderer: 'svg' })
      chart.setOption(option)
      let frame = 0
      new ResizeObserver(() => {
        cancelAnimationFrame(frame)
        frame = requestAnimationFrame(() => chart.resize())
      }).observe(el)
      charts.push(chart)
      return chart
    }

    function applyReducedMotion() {
      if (!reduceMotion) return
      document.querySelectorAll('dvk-count-to').forEach(el => el.setAttribute('disabled', ''))
    }

    mountTitle()
    bindStaticText()
    renderKpi()
    renderSubmeter()
    renderMetrics()

    function boot() {
      document.documentElement.style.setProperty(
        '--dvk-page-ground',
        getComputedStyle(screen).getPropertyValue('--dvk-color-surface').trim(),
      )
      mountChart('#chart-load', loadOption())
      mountChart('#chart-source', sourceOption())
      applyReducedMotion()
    }

    if (document.readyState === 'complete') boot()
    else window.addEventListener('load', boot, { once: true })
  </script>
</body>
</html>
