<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智慧园区标题还原 v2</title>
<style>
  :root {
    color-scheme: dark;
    --bg-0: #071524;
    --bg-1: #06121f;
    --bg-2: #071420;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #06121f;
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  /*
    Reference coordinate system: 2048 × 682.
    Keeping the canvas aspect ratio fixed makes all measured details scale together.
  */
  .reference-canvas {
    position: relative;
    width: min(100vw, calc(100vh * 2048 / 682));
    aspect-ratio: 2048 / 682;
    overflow: hidden;
    container-type: inline-size;
    background:
      radial-gradient(ellipse 58% 34% at 50% 48%, rgba(20, 61, 96, .105) 0%, rgba(10, 34, 56, .035) 44%, transparent 74%),
      linear-gradient(180deg, var(--bg-0) 0%, #071421 19%, #06111d 43%, var(--bg-2) 64%, #06131f 100%);
  }

  /* Very weak horizontal ambience present around the header in the reference. */
  .reference-canvas::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 25.5%;
    height: 31%;
    pointer-events: none;
    background:
      radial-gradient(ellipse 52% 52% at 50% 46%, rgba(14, 52, 84, .085), transparent 73%),
      linear-gradient(180deg, transparent 0%, rgba(3, 12, 21, .11) 30%, rgba(2, 10, 18, .14) 58%, transparent 100%);
  }

  .title-graphic {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .main-title {
    position: absolute;
    z-index: 2;
    top: 29.62%;
    left: 50%;
    width: max-content;
    margin: 0;

    /* Reference ≈ 72px font + ≈16px tracking on a 2048px-wide canvas. */
    font-size: 3.515625cqw;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .78125cqw;
    white-space: nowrap;

    /* The source title is slightly optically right of the geometric center. */
    transform: translateX(-50%) translateX(.537109375cqw);

    color: transparent;
    background: linear-gradient(
      180deg,
      #fbfdff 0%,
      #f1f7fc 20%,
      #e4f0f9 46%,
      #d3e9f9 70%,
      #c7e3fb 100%
    );
    -webkit-background-clip: text;
    background-clip: text;

    /* Crisp, not neon: only a restrained cool lower edge and dark depth. */
    filter:
      drop-shadow(0 .048828125cqw 0 rgba(227, 245, 255, .28))
      drop-shadow(0 .146484375cqw .244140625cqw rgba(0, 7, 15, .42));
  }

  @media (max-width: 720px) {
    .main-title {
      /* Preserve hierarchy on narrow previews; geometry still scales uniformly. */
      font-weight: 700;
    }
  }
</style>
</head>
<body>
  <main class="reference-canvas" aria-label="智慧园区标题参考还原">
    <svg class="title-graphic" viewBox="0 0 2048 682" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <!-- Upper rails grow brighter toward the shoulder, as in the reference. -->
        <linearGradient id="upperRailLeft" gradientUnits="userSpaceOnUse" x1="0" y1="245" x2="390" y2="245">
          <stop offset="0" stop-color="#1b578b" stop-opacity=".55"/>
          <stop offset=".40" stop-color="#2775b9" stop-opacity=".70"/>
          <stop offset=".78" stop-color="#49a8f5" stop-opacity=".95"/>
          <stop offset="1" stop-color="#58b4ff" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="upperRailRight" gradientUnits="userSpaceOnUse" x1="2048" y1="245" x2="1658" y2="245">
          <stop offset="0" stop-color="#1b578b" stop-opacity=".55"/>
          <stop offset=".40" stop-color="#2775b9" stop-opacity=".70"/>
          <stop offset=".78" stop-color="#49a8f5" stop-opacity=".95"/>
          <stop offset="1" stop-color="#58b4ff" stop-opacity="1"/>
        </linearGradient>

        <!-- Thin translucent diagonal ribbons that sit just inside the luminous shoulders. -->
        <linearGradient id="ribbonLeft" gradientUnits="userSpaceOnUse" x1="356" y1="242" x2="476" y2="326">
          <stop offset="0" stop-color="#1767a8" stop-opacity=".26"/>
          <stop offset=".56" stop-color="#115488" stop-opacity=".18"/>
          <stop offset="1" stop-color="#0e416b" stop-opacity=".07"/>
        </linearGradient>
        <linearGradient id="ribbonRight" gradientUnits="userSpaceOnUse" x1="1692" y1="242" x2="1572" y2="326">
          <stop offset="0" stop-color="#1767a8" stop-opacity=".26"/>
          <stop offset=".56" stop-color="#115488" stop-opacity=".18"/>
          <stop offset="1" stop-color="#0e416b" stop-opacity=".07"/>
        </linearGradient>

        <!-- Side support rails: solid near the edge, quietly disappear before the title. -->
        <linearGradient id="supportLeft" gradientUnits="userSpaceOnUse" x1="37" y1="327" x2="570" y2="327">
          <stop offset="0" stop-color="#285f95" stop-opacity=".68"/>
          <stop offset=".16" stop-color="#285f95" stop-opacity=".63"/>
          <stop offset=".72" stop-color="#285f95" stop-opacity=".58"/>
          <stop offset=".92" stop-color="#285f95" stop-opacity=".28"/>
          <stop offset="1" stop-color="#285f95" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="supportRight" gradientUnits="userSpaceOnUse" x1="2011" y1="327" x2="1478" y2="327">
          <stop offset="0" stop-color="#285f95" stop-opacity=".68"/>
          <stop offset=".16" stop-color="#285f95" stop-opacity=".63"/>
          <stop offset=".72" stop-color="#285f95" stop-opacity=".58"/>
          <stop offset=".92" stop-color="#285f95" stop-opacity=".28"/>
          <stop offset="1" stop-color="#285f95" stop-opacity="0"/>
        </linearGradient>

        <!-- Bottom horizon: mostly quiet, with a very narrow white-cyan hot core at center. -->
        <linearGradient id="bottomRail" gradientUnits="userSpaceOnUse" x1="456" y1="355" x2="1592" y2="355">
          <stop offset="0" stop-color="#28577a" stop-opacity=".62"/>
          <stop offset=".34" stop-color="#245a83" stop-opacity=".58"/>
          <stop offset=".43" stop-color="#2179b7" stop-opacity=".64"/>
          <stop offset=".477" stop-color="#2f9eef" stop-opacity=".78"/>
          <stop offset=".493" stop-color="#73caff" stop-opacity=".95"/>
          <stop offset=".499" stop-color="#e6f7ff" stop-opacity="1"/>
          <stop offset=".501" stop-color="#f5fbff" stop-opacity="1"/>
          <stop offset=".507" stop-color="#73caff" stop-opacity=".95"/>
          <stop offset=".523" stop-color="#2f9eef" stop-opacity=".78"/>
          <stop offset=".57" stop-color="#2179b7" stop-opacity=".64"/>
          <stop offset=".66" stop-color="#245a83" stop-opacity=".58"/>
          <stop offset="1" stop-color="#28577a" stop-opacity=".62"/>
        </linearGradient>

        <linearGradient id="bottomGlow" gradientUnits="userSpaceOnUse" x1="790" y1="355" x2="1258" y2="355">
          <stop offset="0" stop-color="#1d8ee8" stop-opacity="0"/>
          <stop offset=".35" stop-color="#239cff" stop-opacity=".22"/>
          <stop offset=".47" stop-color="#35abff" stop-opacity=".56"/>
          <stop offset=".50" stop-color="#9ddfff" stop-opacity=".90"/>
          <stop offset=".53" stop-color="#35abff" stop-opacity=".56"/>
          <stop offset=".65" stop-color="#239cff" stop-opacity=".22"/>
          <stop offset="1" stop-color="#1d8ee8" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="hotCore" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#f7fdff" stop-opacity="1"/>
          <stop offset=".22" stop-color="#a9e4ff" stop-opacity=".95"/>
          <stop offset=".52" stop-color="#36aaff" stop-opacity=".54"/>
          <stop offset="1" stop-color="#168cf0" stop-opacity="0"/>
        </radialGradient>

        <filter id="railGlow" x="-15%" y="-300%" width="130%" height="700%">
          <feGaussianBlur stdDeviation="2.2"/>
        </filter>
        <filter id="centerBlur" x="-80%" y="-500%" width="260%" height="1100%">
          <feGaussianBlur stdDeviation="4.4"/>
        </filter>
        <filter id="coreBlur" x="-200%" y="-700%" width="500%" height="1500%">
          <feGaussianBlur stdDeviation="2.0"/>
        </filter>
      </defs>

      <!-- The reference has narrow diagonal translucent ribbons, not large trapezoid plates. -->
      <path d="M352 238 H396 L477 327 H433 Z" fill="url(#ribbonLeft)"/>
      <path d="M1696 238 H1652 L1571 327 H1615 Z" fill="url(#ribbonRight)"/>

      <!-- Soft under-glow; kept weaker than the crisp rail itself. -->
      <path d="M0 245 H358 L456 355" fill="none" stroke="#258ce7" stroke-opacity=".18" stroke-width="5" filter="url(#railGlow)"/>
      <path d="M2048 245 H1690 L1592 355" fill="none" stroke="#258ce7" stroke-opacity=".18" stroke-width="5" filter="url(#railGlow)"/>

      <!-- Crisp upper rails + shoulders. -->
      <path d="M0 245 H358 L456 355" fill="none" stroke="url(#upperRailLeft)" stroke-width="2.1"/>
      <path d="M2048 245 H1690 L1592 355" fill="none" stroke="url(#upperRailRight)" stroke-width="2.1"/>

      <!-- Mid support rails. They start at x=37 / x=2011, not at the canvas edge. -->
      <path d="M37 327 H570" fill="none" stroke="url(#supportLeft)" stroke-width="1.35"/>
      <path d="M2011 327 H1478" fill="none" stroke="url(#supportRight)" stroke-width="1.35"/>

      <!-- Two-level edge ticks from the reference: bright short head + dimmer continuation. -->
      <path d="M37 327 H72" fill="none" stroke="#58b8ff" stroke-width="3.1"/>
      <path d="M72 327 H97" fill="none" stroke="#347ab8" stroke-opacity=".78" stroke-width="2.0"/>
      <path d="M2011 327 H1976" fill="none" stroke="#58b8ff" stroke-width="3.1"/>
      <path d="M1976 327 H1951" fill="none" stroke="#347ab8" stroke-opacity=".78" stroke-width="2.0"/>

      <!-- Bottom recessed horizon. -->
      <path d="M456 355 H1592" fill="none" stroke="#183b58" stroke-opacity=".42" stroke-width="3" filter="url(#railGlow)"/>
      <path d="M456 355 H1592" fill="none" stroke="url(#bottomRail)" stroke-width="1.25"/>

      <!-- The center highlight in the source is tiny and white-hot, with a much wider low-energy halo. -->
      <path d="M790 355 H1258" fill="none" stroke="url(#bottomGlow)" stroke-width="4.8" opacity=".46" filter="url(#centerBlur)"/>
      <ellipse cx="1024" cy="355" rx="54" ry="5.6" fill="url(#hotCore)" opacity=".38" filter="url(#coreBlur)"/>
      <path d="M1008 355 H1040" fill="none" stroke="#dff6ff" stroke-width="1.35" stroke-opacity=".94"/>
    </svg>

    <!-- No subtitle by design. -->
    <h1 class="main-title">智慧园区综合运营监控平台</h1>
  </main>
</body>
</html>
