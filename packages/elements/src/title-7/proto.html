<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>科技标题 - 参考图精细还原</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#040d1b}
  body{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  .stage{
    position:relative;
    width:100vw;height:100vh;min-height:320px;overflow:hidden;
    background:
      radial-gradient(ellipse 43% 28% at 50% 11%, rgba(10,49,84,.68) 0%, rgba(7,34,59,.34) 40%, rgba(4,18,34,.04) 76%, transparent 100%),
      linear-gradient(180deg,#081426 0%,#050f1d 19%,#050e1c 54%,#040d1b 100%);
  }
  .hud{position:absolute;inset:0;width:100%;height:100%;display:block}
  .main-title{
    font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    font-size:48px;
    font-weight:700;
    letter-spacing:.65px;
  }
</style>
</head>
<body>
<main class="stage">
<svg class="hud" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice" aria-label="智慧园区综合运营监控平台">
  <defs>
    <!-- 左右顶部粗带：越靠近折肩越亮 -->
    <linearGradient id="leftRibbon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="405" y2="0">
      <stop offset="0" stop-color="#071223"/>
      <stop offset=".25" stop-color="#091a32"/>
      <stop offset=".50" stop-color="#0e2c56"/>
      <stop offset=".625" stop-color="#11366a"/>
      <stop offset=".75" stop-color="#164383"/>
      <stop offset=".85" stop-color="#184f96"/>
      <stop offset="1" stop-color="#229cdc"/>
    </linearGradient>
    <linearGradient id="rightRibbon" gradientUnits="userSpaceOnUse" x1="1672" y1="0" x2="1267" y2="0">
      <stop offset="0" stop-color="#071223"/>
      <stop offset=".25" stop-color="#091a32"/>
      <stop offset=".50" stop-color="#0e2c56"/>
      <stop offset=".625" stop-color="#11366a"/>
      <stop offset=".75" stop-color="#164383"/>
      <stop offset=".85" stop-color="#184f96"/>
      <stop offset="1" stop-color="#229cdc"/>
    </linearGradient>

    <linearGradient id="leftSideRail" gradientUnits="userSpaceOnUse" x1="143" y1="0" x2="313" y2="0">
      <stop offset="0" stop-color="#092b4a"/>
      <stop offset=".15" stop-color="#185480"/>
      <stop offset=".48" stop-color="#226f9e"/>
      <stop offset="1" stop-color="#2d87b2"/>
    </linearGradient>
    <linearGradient id="rightSideRail" gradientUnits="userSpaceOnUse" x1="1529" y1="0" x2="1359" y2="0">
      <stop offset="0" stop-color="#092b4a"/>
      <stop offset=".15" stop-color="#185480"/>
      <stop offset=".48" stop-color="#226f9e"/>
      <stop offset="1" stop-color="#2d87b2"/>
    </linearGradient>

    <linearGradient id="nodeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23abe5"/>
      <stop offset=".55" stop-color="#35b7f0"/>
      <stop offset="1" stop-color="#2bbef0"/>
    </linearGradient>
    <linearGradient id="nodeRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23abe5"/>
      <stop offset=".55" stop-color="#35b7f0"/>
      <stop offset="1" stop-color="#2bbef0"/>
    </linearGradient>


    <linearGradient id="leftDiag" gradientUnits="userSpaceOnUse" x1="368" y1="67" x2="421" y2="118">
      <stop offset="0" stop-color="#123b64"/>
      <stop offset=".25" stop-color="#1b5d8d"/>
      <stop offset=".50" stop-color="#278ac2"/>
      <stop offset=".75" stop-color="#35b5e8"/>
      <stop offset="1" stop-color="#48c7ef"/>
    </linearGradient>
    <linearGradient id="rightDiag" gradientUnits="userSpaceOnUse" x1="1304" y1="67" x2="1251" y2="118">
      <stop offset="0" stop-color="#123b64"/>
      <stop offset=".25" stop-color="#1b5d8d"/>
      <stop offset=".50" stop-color="#278ac2"/>
      <stop offset=".75" stop-color="#35b5e8"/>
      <stop offset="1" stop-color="#48c7ef"/>
    </linearGradient>
    <linearGradient id="titleFill" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="92">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset=".167" stop-color="#f0f2f4"/>
      <stop offset=".333" stop-color="#ebf3f8"/>
      <stop offset=".50" stop-color="#d1e9f7"/>
      <stop offset=".667" stop-color="#b9e0f7"/>
      <stop offset=".833" stop-color="#9ed9f8"/>
      <stop offset="1" stop-color="#9bd8f8"/>
    </linearGradient>
    <linearGradient id="centerStroke" gradientUnits="userSpaceOnUse" x1="421" y1="0" x2="1251" y2="0">
      <stop offset="0" stop-color="#279dc7" stop-opacity=".96"/>
      <stop offset=".18" stop-color="#247fa8" stop-opacity=".87"/>
      <stop offset=".38" stop-color="#1783aa" stop-opacity=".82"/>
      <stop offset=".50" stop-color="#20c4e9" stop-opacity=".96"/>
      <stop offset=".62" stop-color="#1783aa" stop-opacity=".82"/>
      <stop offset=".82" stop-color="#247fa8" stop-opacity=".87"/>
      <stop offset="1" stop-color="#279dc7" stop-opacity=".96"/>
    </linearGradient>


    <linearGradient id="beamTop" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1052" y2="0">
      <stop offset="0" stop-color="#0b3757"/>
      <stop offset=".07" stop-color="#0d5078"/>
      <stop offset=".185" stop-color="#0d658e"/>
      <stop offset=".30" stop-color="#1396c4"/>
      <stop offset=".417" stop-color="#1ed9fe"/>
      <stop offset=".50" stop-color="#64fcff"/>
      <stop offset=".648" stop-color="#139dcd"/>
      <stop offset=".764" stop-color="#0e6d96"/>
      <stop offset=".88" stop-color="#0d4e71"/>
      <stop offset="1" stop-color="#15567d"/>
    </linearGradient>
    <linearGradient id="beamCore" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1052" y2="0">
      <stop offset="0" stop-color="#0a243b" stop-opacity="0"/>
      <stop offset=".07" stop-color="#0b3451"/>
      <stop offset=".185" stop-color="#0a5b84"/>
      <stop offset=".30" stop-color="#108dbd"/>
      <stop offset=".417" stop-color="#19cef2"/>
      <stop offset=".50" stop-color="#5af0fa"/>
      <stop offset=".648" stop-color="#0e94c4"/>
      <stop offset=".764" stop-color="#0a648e"/>
      <stop offset=".88" stop-color="#093c5d"/>
      <stop offset="1" stop-color="#081e35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="1032" y2="0">
      <stop offset="0" stop-color="#00b5e8" stop-opacity="0"/>
      <stop offset=".20" stop-color="#13c8f5" stop-opacity=".15"/>
      <stop offset=".39" stop-color="#19dcff" stop-opacity=".62"/>
      <stop offset=".50" stop-color="#b6ffff" stop-opacity="1"/>
      <stop offset=".61" stop-color="#19dcff" stop-opacity=".62"/>
      <stop offset=".80" stop-color="#13c8f5" stop-opacity=".15"/>
      <stop offset="1" stop-color="#00b5e8" stop-opacity="0"/>
    </linearGradient>
    <filter id="beamBlur" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3.1"/>
    </filter>
    <filter id="lineGlow" x="-15%" y="-200%" width="130%" height="500%">
      <feGaussianBlur stdDeviation="1.25"/>
    </filter>
    <filter id="titleSoftGlow" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- 顶部两侧的连续粗带 + 折肩：这是参考图里最容易漏掉的结构 -->
  <path d="M0 63 H354 L405 111 H357 L315 72 H0 Z" fill="url(#leftRibbon)"/>
  <path d="M1672 63 H1318 L1267 111 H1315 L1357 72 H1672 Z" fill="url(#rightRibbon)"/>

  <!-- 折肩外侧那一根极细的独立线，左右通过下方主基线连成一体 -->
  <path d="M368 67 L421 118.5" fill="none" stroke="url(#leftDiag)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <path d="M1251 118.5 L1304 67" fill="none" stroke="url(#rightDiag)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <path d="M368 67 L421 118.5 M1251 118.5 L1304 67" fill="none" stroke="#1acfff" stroke-width="2.2" vector-effect="non-scaling-stroke" opacity=".035" filter="url(#lineGlow)"/>

  <!-- 中央横线上的宽而薄的高光，参考图不是一个小光点，而是一段水平光带 -->
  <rect x="570" y="113.8" width="532" height="10.5" rx="5.25" fill="url(#beam)" opacity=".42" filter="url(#beamBlur)"/>
  <rect x="620" y="118" width="432" height="4" fill="url(#beamCore)" opacity="1"/>
  <line x1="421" y1="118.5" x2="620" y2="118.5" stroke="url(#centerStroke)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <line x1="620" y1="118.5" x2="1052" y2="118.5" stroke="url(#beamTop)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <line x1="1052" y1="118.5" x2="1251" y2="118.5" stroke="url(#centerStroke)" stroke-width="1" vector-effect="non-scaling-stroke"/>

  <!-- 左下四枚斜杠：四枚并不是同色同宽 -->
  <g>
    <polygon points="55,94 69,94 78,107 65,107" fill="#133b6a"/>
    <polygon points="75,94 84,94 94,107 85,107" fill="#17558b"/>
    <polygon points="90,94 98,94 108,107 99,107" fill="#1d70b4"/>
    <polygon points="104,94 118,94 129,107 114,107" fill="#2186c6"/>
    <path d="M58 109 H130" stroke="#0b2d4e" stroke-width="1" opacity=".38"/>
  </g>

  <!-- 左侧短轨与六边形收口 -->
  <line x1="143" y1="100.5" x2="298" y2="100.5" stroke="url(#leftSideRail)" stroke-width="1" opacity=".45" vector-effect="non-scaling-stroke"/>
  <line x1="143" y1="101.5" x2="298" y2="101.5" stroke="url(#leftSideRail)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <line x1="143" y1="102.5" x2="297" y2="102.5" stroke="#0b3455" stroke-width="1" opacity=".24" vector-effect="non-scaling-stroke"/>
  <polygon points="296,96 306,96 312,103 311,108 301,108 296,102 294,102 294,98"
           fill="url(#nodeLeft)"/>
  <path d="M296 96 H306" stroke="#77e8ff" stroke-width=".7" opacity=".48"/>

  <!-- 右侧完全镜像 -->
  <g>
    <polygon points="1617,94 1603,94 1594,107 1607,107" fill="#133b6a"/>
    <polygon points="1597,94 1588,94 1578,107 1587,107" fill="#17558b"/>
    <polygon points="1582,94 1574,94 1564,107 1573,107" fill="#1d70b4"/>
    <polygon points="1568,94 1554,94 1543,107 1558,107" fill="#2186c6"/>
    <path d="M1542 109 H1614" stroke="#0b2d4e" stroke-width="1" opacity=".38"/>
  </g>
  <line x1="1529" y1="100.5" x2="1374" y2="100.5" stroke="url(#rightSideRail)" stroke-width="1" opacity=".45" vector-effect="non-scaling-stroke"/>
  <line x1="1529" y1="101.5" x2="1374" y2="101.5" stroke="url(#rightSideRail)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <line x1="1529" y1="102.5" x2="1375" y2="102.5" stroke="#0b3455" stroke-width="1" opacity=".24" vector-effect="non-scaling-stroke"/>
  <polygon points="1376,96 1366,96 1360,103 1361,108 1371,108 1376,102 1378,102 1378,98"
           fill="url(#nodeRight)"/>
  <path d="M1376 96 H1366" stroke="#77e8ff" stroke-width=".7" opacity=".48"/>

  <!-- 标题：先画一个向下的青色“厚度”，再叠白色正文；参考图不是普通 glow -->
  <text class="main-title" x="836" y="89" text-anchor="middle"
        fill="#245f8b" opacity=".16">智慧园区综合运营监控平台</text>
  <text class="main-title" x="836" y="85" text-anchor="middle"
        fill="url(#titleFill)" stroke="#e6f0f4" stroke-width=".22"
        style="paint-order:stroke fill">智慧园区综合运营监控平台</text>
  <text class="main-title" x="836" y="85" text-anchor="middle"
        fill="none" stroke="#a8e4ff" stroke-width="1.2" opacity=".045" filter="url(#titleSoftGlow)">智慧园区综合运营监控平台</text>
</svg>
</main>
</body>
</html>
