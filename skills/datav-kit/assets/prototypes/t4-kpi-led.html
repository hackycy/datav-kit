<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>datav-kit prototype · T4 KPI 主导</title>

  <!-- ==========================================================================
    DECLARATION 1/4 — SKELETON (rows / 12-column spans / fluid row heights)
    --------------------------------------------------------------------------
    Canvas     1920 x 1080, mode="contain", align="center center"   (P1)
    Screen     margin var(--dvk-screen-safe-margin) 48px, block gap 24px
    Rows       header  var(--dvk-screen-header-height)  104px   (fixed by contract)
               KPI     var(--dvk-screen-kpi-height) * 2 208px   (fixed by contract)
               main    minmax(0, 1fr)                            (fluid)
    Main       12 columns x minmax(0, 1fr), gutter var(--dvk-screen-grid-gutter) 24px
               left  span 6   minmax(0, 1fr)
               right span 6   minmax(0, 1fr)
    Fluid      every main-region row is minmax(0, ...) and every column and panel
               carries min-height: 0 — no fixed px row can clip content.
    ========================================================================== -->

  <!-- ==========================================================================
    DECLARATION 2/4 — BLOCK LIST (pattern references)
    --------------------------------------------------------------------------
    header      P2 three-part header + P3 compact title bar (no rails on T4)
    KPI row     P4 enlarged KPI strip, 6 cards built from P14 + P16
    main  1     P6+P7+P9    horizontal progress rows
    main  2     P6+P7+P10   rank / pressure rows
    metrics     P16         dvk-count-to for every animating number
    The six enlarged cards use P14's construction (surface panel + label + value +
    caption) with the value at --dvk-screen-font-size-xl (44px); the hero size
    (56px) is a one-per-screen metric exception and T3 owns it, so no T4 card uses
    it. No chart slot exists in T4: the KPI strip is the visual lead and P9 / P10
    are DOM visualisations, not chart containers.
    ========================================================================== -->

  <!-- ==========================================================================
    DECLARATION 3/4 — COMPONENT CONSTRUCTION (tag + key attributes)
    --------------------------------------------------------------------------
    dvk-fit-screen      width="1920" height="1080" mode="contain"
                        align="center center" fit-target="viewport"
    dvk-border-box-10   the 6 enlarged KPI cards, rounded glow surface panel (P6
                        role, P14 construction) background-color="var(--dvk-color-surface)"
    dvk-border-box-9    P9 panel, restrained static surface (P6 role)
                        background-color="var(--dvk-color-surface)"
    dvk-border-box-7    P10 panel, chamfered surface (P6 role)
                        background-color="var(--dvk-color-surface)"
    dvk-count-to        end-val / duration="1400" (P16: one duration per screen),
                        disabled under prefers-reduced-motion: reduce
    Panel titles live inside the default slot (P7 .panel-heading) — no border box
    has a #header or #title slot. The Title 4 variant does not exist and is never
    used: only dvk-title-1 / -2 / -3 are probed.
    ========================================================================== -->

  <!-- ==========================================================================
    DECLARATION 4/4 — PLACEHOLDER DATA SHAPE (inline JSON, #dvk-data)
    --------------------------------------------------------------------------
    {
      "header": { "eyebrow": string, "title": string, "region": string,
                  "period": string },
      "kpi":    [ { "label": string, "value": number, "unit": string,
                    "delta": string, "direction": "up"|"down"|"flat" } ] x6,
      "share":  [ { "label": string, "value": number } ] x8,
      "rank":   [ { "code": string, "name": string, "status": string,
                    "value": number } ] x5
    }
    ========================================================================== -->

  <!-- ==========================================================================
    PERMISSION TIERS (issue 08 §3 — three tiers, unchanged by this file)
    --------------------------------------------------------------------------
    skeleton redline (changing one sends the work back to the prototype):
      row count, column count, primary-view position, header form, block add/remove
    recommended values (changeable, must be registered as a deviation):
      block proportions, spacing, density, decoration strength, theme
    free zone (changeable inside a block):
      pattern substitution, business copy, chart type and option, placeholder data
    ========================================================================== -->

  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/cyber-blue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/neon-magenta.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/matrix-green.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/solar-gold.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/ice-white.css">

  <script type="importmap">
    {
      "imports": {
        "@datav-kit/elements@0.0.5": "https://cdn.jsdelivr.net/npm/@datav-kit/elements@0.0.5/+esm"
      }
    }
  </script>
  <!-- CDN backup if jsDelivr +esm is unavailable:
       "@datav-kit/elements@0.0.5": "https://esm.sh/@datav-kit/elements@0.0.5" -->

  <style>
    html {
      /* The page ground is the active theme's surface colour over the UA dark
         canvas base. No colour literal is declared in this file. */
      color-scheme: dark;
      background-color: var(--dvk-page-ground, var(--dvk-color-surface));
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--dvk-screen-font-family);
    }

    .dvk-screen {
      /* Single colour source: every colour below derives from --dvk-color-*. */
      --dvk-text-strong: var(--dvk-color-primary);
      --dvk-text-muted: color-mix(in srgb, var(--dvk-color-primary) 64%, transparent);
      --dvk-text-faint: color-mix(in srgb, var(--dvk-color-primary) 38%, transparent);
      --dvk-rule: color-mix(in srgb, var(--dvk-color-primary) 20%, transparent);
      --dvk-fill-soft: color-mix(in srgb, var(--dvk-color-primary) 12%, transparent);
      --dvk-fill-mid: color-mix(in srgb, var(--dvk-color-primary) 22%, transparent);
      --dvk-surface-fill: color-mix(in srgb, var(--dvk-color-surface) 88%, transparent);

      position: relative;
      box-sizing: border-box;
      width: 1920px;
      height: 1080px;
      padding: var(--dvk-screen-safe-margin);
      display: grid;
      grid-template-rows:
        var(--dvk-screen-header-height)
        calc(var(--dvk-screen-kpi-height) * 2)
        minmax(0, 1fr);
      gap: var(--dvk-screen-space-xl);
      color: var(--dvk-text-muted);
      font-size: var(--dvk-screen-font-size-xs);
      line-height: var(--dvk-screen-line-height-base);
      overflow: hidden;
    }

    .unit { font-size: var(--dvk-screen-font-size-sm); color: var(--dvk-text-faint); }

    /* ---------- P2 three-part header + P3 compact title (no rails on T4) ---------- */
    .screen-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: var(--dvk-screen-space-xl);
      min-height: 0;
      border-bottom: var(--dvk-line-width) solid var(--dvk-rule);
    }

    .header-info {
      display: grid;
      gap: var(--dvk-screen-space-xs);
      padding: var(--dvk-screen-space-lg) var(--dvk-screen-space-xl);
      border-left: 4px solid var(--dvk-color-accent);
      background: var(--dvk-surface-fill);
    }

    .header-info--right {
      justify-self: end;
      text-align: right;
      border-left: 0;
      border-right: 4px solid var(--dvk-color-secondary);
    }

    .header-info .label {
      font-size: var(--dvk-screen-font-size-xs);
      line-height: 1;
      color: var(--dvk-text-faint);
      letter-spacing: 0.12em;
    }

    .header-info .value {
      font-size: var(--dvk-screen-font-size-sm);
      font-weight: var(--dvk-screen-font-weight-medium);
      line-height: 1.2;
      color: var(--dvk-text-strong);
    }

    .title-block {
      padding: var(--dvk-screen-space-sm) var(--dvk-screen-space-2xl);
      text-align: center;
      border-top: var(--dvk-line-width) solid var(--dvk-rule);
      border-bottom: var(--dvk-line-width) solid var(--dvk-rule);
    }

    .title-block .eyebrow {
      display: block;
      font-size: var(--dvk-screen-font-size-xs);
      line-height: 1.2;
      letter-spacing: 0.24em;
      color: var(--dvk-text-faint);
    }

    .title-block h1 {
      margin: var(--dvk-screen-space-xs) 0 0;
      font-size: var(--dvk-screen-font-size-xl);
      font-weight: var(--dvk-screen-font-weight-bold);
      line-height: 1.1;
      color: var(--dvk-text-strong);
    }

    /* ---------- P4 enlarged KPI strip (208px, 6 cards) ---------- */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: var(--dvk-screen-space-2xl);
      min-height: 0;
    }

    .kpi-strip > dvk-border-box-10 { min-width: 0; min-height: 0; }

    .kpi-card {
      display: grid;
      align-content: center;
      gap: var(--dvk-screen-space-sm);
      height: 100%;
    }

    .kpi-card .label {
      font-size: var(--dvk-screen-font-size-xs);
      line-height: 1.2;
      color: var(--dvk-text-muted);
    }

    .value-row { display: flex; align-items: baseline; gap: var(--dvk-screen-space-sm); }

    .kpi-card .delta {
      font-size: var(--dvk-screen-font-size-xs);
      color: var(--dvk-text-faint);
    }

    .kpi-card[data-direction='up'] .delta { color: var(--dvk-color-accent); }
    .kpi-card[data-direction='down'] .delta { color: var(--dvk-color-secondary); }

    /* ---------- P5 main grid: 6 / 6 of 12 columns ---------- */
    .screen-main {
      display: grid;
      grid-template-columns: repeat(var(--dvk-screen-grid-columns), minmax(0, 1fr));
      gap: var(--dvk-screen-grid-gutter);
      min-height: 0;
    }

    .col { display: grid; gap: var(--dvk-screen-space-xl); min-height: 0; }
    .col > * { min-height: 0; }
    .col-left { grid-column: span 6; grid-template-rows: minmax(0, 1fr); }
    .col-right { grid-column: span 6; grid-template-rows: minmax(0, 1fr); }

    /* ---------- P6 + P7 panel container and head ---------- */
    .panel-inner {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: var(--dvk-screen-space-lg);
      height: 100%;
      min-height: 0;
    }

    .panel-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--dvk-screen-space-md);
    }

    .panel-heading .eyebrow {
      margin: 0;
      font-size: var(--dvk-screen-font-size-sm);
      line-height: 1.2;
      color: var(--dvk-text-faint);
      letter-spacing: 0.14em;
    }

    .panel-heading h3 {
      margin: 0;
      font-size: var(--dvk-screen-font-size-md);
      font-weight: var(--dvk-screen-font-weight-bold);
      line-height: 1.2;
      color: var(--dvk-text-strong);
    }

    .chip {
      flex: 0 0 auto;
      padding: 5px 9px;
      border: var(--dvk-line-width) solid var(--dvk-rule);
      font-size: var(--dvk-screen-font-size-xs);
      line-height: 1.2;
      color: var(--dvk-color-accent);
      background: var(--dvk-fill-soft);
    }

    .panel-body { min-height: 0; overflow: hidden; }

    /* ---------- P9 horizontal progress row ---------- */
    .progress-list { display: grid; gap: var(--dvk-screen-space-lg); align-content: start; }

    .progress-row { display: grid; gap: var(--dvk-screen-space-sm); }

    .progress-row__head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--dvk-screen-space-md);
    }

    .bar {
      height: 8px;
      overflow: hidden;
      background: var(--dvk-fill-soft);
    }

    .bar > i {
      display: block;
      width: var(--bar-value);
      height: 100%;
      background: linear-gradient(90deg, var(--dvk-color-secondary), var(--dvk-color-primary));
    }

    /* ---------- P10 rank / pressure row ---------- */
    .rank-list { display: grid; gap: var(--dvk-screen-space-md); align-content: start; }

    .rank-row {
      display: grid;
      grid-template-columns: minmax(0, 150px) minmax(0, 1fr);
      align-items: center;
      gap: var(--dvk-screen-space-md);
      padding: var(--dvk-screen-space-md) var(--dvk-screen-space-lg);
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background: var(--dvk-surface-fill);
    }

    .rank-row .name-zone {
      display: flex;
      align-items: baseline;
      gap: var(--dvk-screen-space-sm);
      min-width: 0;
      white-space: nowrap;
    }

    .rank-row .code {
      font-size: var(--dvk-screen-font-size-md);
      font-weight: var(--dvk-screen-font-weight-bold);
      line-height: 1.2;
      color: var(--dvk-text-strong);
    }

    .rank-row .name {
      font-size: var(--dvk-screen-font-size-xs);
      color: var(--dvk-text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-row .status {
      justify-self: end;
      font-style: normal;
      font-size: var(--dvk-screen-font-size-xs);
      color: var(--dvk-color-accent);
    }

    .rank-row .bar { grid-column: 1 / -1; }

    /* ---------- P16 count-to sizing (host-level, not per instance) ---------- */
    .kpi-card dvk-count-to {
      /* Enlarged KPI value; the hero 56px exception stays a one-per-screen metric
         and belongs to T3, so T4's six cards stay on the xl step. */
      --dvk-count-to-font-size: var(--dvk-screen-font-size-xl);
      --dvk-count-to-font-weight: var(--dvk-screen-font-weight-bold);
      --dvk-count-to-color: var(--dvk-text-strong);
    }

    .progress-row dvk-count-to {
      --dvk-count-to-font-size: var(--dvk-screen-font-size-sm);
      --dvk-count-to-color: var(--dvk-text-strong);
      --dvk-count-to-affix-font-size: calc(var(--dvk-screen-font-size-sm) * 0.75);
    }

    /* ---------- demo-only theme switcher (outside the 1920x1080 canvas) ---------- */
    .demo-controls {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background: var(--dvk-surface-fill);
      font-size: var(--dvk-screen-font-size-xs);
    }

    .demo-controls button {
      padding: 4px 10px;
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background: transparent;
      color: var(--dvk-text-muted);
      font: inherit;
      cursor: pointer;
    }

    .demo-controls button.is-active { color: var(--dvk-text-strong); background: var(--dvk-fill-mid); }
  </style>
</head>

<body>
  <!-- Demo-only control: switches the single theme class on the screen root.
     It sits outside the 1920x1080 canvas, so the screen skeleton is untouched. -->
  <div class="demo-controls" role="group" aria-label="主题切换">
    <span>THEME</span>
    <button type="button" data-theme="cyber-blue">cyber-blue</button>
    <button type="button" data-theme="neon-magenta">neon-magenta</button>
    <button type="button" data-theme="matrix-green">matrix-green</button>
    <button type="button" data-theme="solar-gold">solar-gold</button>
    <button type="button" data-theme="ice-white">ice-white</button>
  </div>

  <dvk-fit-screen width="1920" height="1080" mode="contain" align="center center" fit-target="viewport">
    <div class="dvk-screen dvk-theme-cyber-blue" id="screen">

      <header class="screen-header">
        <div class="header-info">
          <span class="label">REGION</span>
          <strong class="value" data-bind="header.region"></strong>
        </div>
        <div class="title-group" id="title-group"></div>
        <div class="header-info header-info--right">
          <span class="label">PERIOD</span>
          <strong class="value" data-bind="header.period"></strong>
        </div>
      </header>

      <section class="kpi-strip" id="kpi-strip" aria-label="KPI"></section>

      <main class="screen-main">
        <div class="col col-left">
          <dvk-border-box-9 background-color="var(--dvk-color-surface)">
            <div class="panel-inner">
              <header class="panel-heading">
                <div>
                  <p class="eyebrow">TARGET</p>
                  <h3>指标完成度</h3>
                </div>
                <span class="chip">本月</span>
              </header>
              <div class="panel-body"><div class="progress-list" id="share-list"></div></div>
            </div>
          </dvk-border-box-9>
        </div>

        <div class="col col-right">
          <dvk-border-box-7 background-color="var(--dvk-color-surface)">
            <div class="panel-inner">
              <header class="panel-heading">
                <div>
                  <p class="eyebrow">PRESSURE</p>
                  <h3>区域负载</h3>
                </div>
                <span class="chip">TOP 5</span>
              </header>
              <div class="panel-body"><div class="rank-list" id="rank-list"></div></div>
            </div>
          </dvk-border-box-7>
        </div>
      </main>
    </div>
  </dvk-fit-screen>

  <script type="application/json" id="dvk-data">
    {
      "header": {
        "eyebrow": "BUSINESS COCKPIT",
        "title": "经营指标驾驶舱",
        "region": "华东 · 上海",
        "period": "2026-09"
      },
      "kpi": [
        { "label": "营收", "value": 1284, "unit": "万元", "delta": "环比 +8.2%", "direction": "up" },
        { "label": "订单量", "value": 48621, "unit": "单", "delta": "环比 +5.4%", "direction": "up" },
        { "label": "客单价", "value": 264, "unit": "元", "delta": "环比 -1.1%", "direction": "down" },
        { "label": "履约率", "value": 96, "unit": "%", "delta": "环比 +0.6%", "direction": "up" },
        { "label": "在线设备", "value": 1284, "unit": "台", "delta": "环比 +2.9%", "direction": "up" },
        { "label": "未闭环告警", "value": 7, "unit": "条", "delta": "环比 -3 条", "direction": "flat" }
      ],
      "share": [
        { "label": "华东大区", "value": 86 },
        { "label": "华南大区", "value": 78 },
        { "label": "华北大区", "value": 72 },
        { "label": "西南大区", "value": 64 },
        { "label": "华中大区", "value": 58 },
        { "label": "东北大区", "value": 51 },
        { "label": "西北大区", "value": 44 },
        { "label": "海外区域", "value": 31 }
      ],
      "rank": [
        { "code": "SH-01", "name": "浦东枢纽", "status": "正常", "value": 92 },
        { "code": "SH-04", "name": "徐汇枢纽", "status": "偏高", "value": 78 },
        { "code": "SH-07", "name": "临港枢纽", "status": "正常", "value": 64 },
        { "code": "SH-09", "name": "青浦枢纽", "status": "正常", "value": 51 },
        { "code": "SH-12", "name": "嘉定枢纽", "status": "偏低", "value": 43 }
      ]
    }
  </script>

  <script type="module">
    import { register } from '@datav-kit/elements@0.0.5'

    const THEMES = ['cyber-blue', 'neon-magenta', 'matrix-green', 'solar-gold', 'ice-white']
    const COUNT_DURATION = 1400 // P16: one count-up duration per screen
    const data = JSON.parse(document.querySelector('#dvk-data').textContent)
    const screen = document.querySelector('#screen')
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches

    register()

    /* P3 title bar: feature-detect the component, otherwise build the P3 fallback.
       T4 uses the compact variant, so the fallback path has no decoration rails. */
    function mountTitle() {
      const group = document.querySelector('#title-group')
      // The Title 4 variant does not exist; only 1-3 are ever probed.
      const tag = ['dvk-title-1', 'dvk-title-2', 'dvk-title-3'].find(name => customElements.get(name))

      if (tag) {
        const el = document.createElement(tag)
        el.setAttribute('title-text', data.header.title)
        group.append(el)
        group.dataset.titlePath = 'component'
        return
      }

      const block = document.createElement('div')
      block.className = 'title-block'
      block.innerHTML = `
        <span class="eyebrow">${data.header.eyebrow}</span>
        <h1>${data.header.title}</h1>`
      group.append(block)
      group.dataset.titlePath = 'p3-fallback-compact'
    }

    function renderKpi() {
      document.querySelector('#kpi-strip').innerHTML = data.kpi.map(item => `
        <dvk-border-box-10 background-color="var(--dvk-color-surface)">
          <div class="kpi-card" data-direction="${item.direction}">
            <span class="label">${item.label}</span>
            <span class="value-row">
              <dvk-count-to end-val="${item.value}" duration="${COUNT_DURATION}"></dvk-count-to>
              <span class="unit">${item.unit}</span>
            </span>
            <span class="delta">${item.delta}</span>
          </div>
        </dvk-border-box-10>`).join('')
    }

    function renderShare() {
      document.querySelector('#share-list').innerHTML = data.share.map(item => `
        <div class="progress-row">
          <div class="progress-row__head">
            <span>${item.label}</span>
            <dvk-count-to end-val="${item.value}" suffix="%" duration="${COUNT_DURATION}"></dvk-count-to>
          </div>
          <div class="bar"><i style="--bar-value: ${item.value}%"></i></div>
        </div>`).join('')
    }

    function renderRank() {
      document.querySelector('#rank-list').innerHTML = data.rank.map(item => `
        <article class="rank-row">
          <span class="name-zone">
            <strong class="code">${item.code}</strong>
            <span class="name">${item.name}</span>
          </span>
          <em class="status">${item.status}</em>
          <div class="bar"><i style="--bar-value: ${item.value}%"></i></div>
        </article>`).join('')
    }

    function bindStaticText() {
      document.querySelectorAll('[data-bind]').forEach((el) => {
        const path = el.dataset.bind.split('.')
        el.textContent = path.reduce((node, key) => node[key], data)
      })
    }

    /* One theme per screen: exactly one .dvk-theme-* class on the screen root. */
    function applyTheme(name) {
      THEMES.forEach(theme => screen.classList.remove(`dvk-theme-${theme}`))
      screen.classList.add(`dvk-theme-${name}`)
      document.documentElement.style.setProperty(
        '--dvk-page-ground',
        getComputedStyle(screen).getPropertyValue('--dvk-color-surface').trim(),
      )
      document.querySelectorAll('[data-theme]').forEach((button) => {
        button.classList.toggle('is-active', button.dataset.theme === name)
      })
    }

    function applyReducedMotion() {
      if (!reduceMotion) return
      document.querySelectorAll('dvk-count-to').forEach(el => el.setAttribute('disabled', ''))
    }

    mountTitle()
    bindStaticText()
    renderKpi()
    renderShare()
    renderRank()

    /* Theme tokens are read with getComputedStyle, so the themed boot waits for the
       external theme stylesheets to finish loading — a module script can run before
       a CDN stylesheet has been applied, which would yield empty token values. */
    function boot() {
      applyTheme('cyber-blue')
      applyReducedMotion()
    }

    if (document.readyState === 'complete') boot()
    else window.addEventListener('load', boot, { once: true })

    document.querySelectorAll('[data-theme]').forEach((button) => {
      button.addEventListener('click', () => applyTheme(button.dataset.theme))
    })
  </script>
</body>
</html>
