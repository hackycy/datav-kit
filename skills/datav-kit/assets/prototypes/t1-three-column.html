<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>datav-kit prototype · T1 三栏运维</title>

  <!-- ==========================================================================
    DECLARATION 1/4 — SKELETON (rows / 12-column spans / fluid row heights)
    --------------------------------------------------------------------------
    Canvas     1920 x 1080, mode="contain", align="center center"   (P1)
    Screen     margin var(--dvk-screen-safe-margin) 48px, block gap 24px
    Rows       header  var(--dvk-screen-header-height)  104px   (fixed by contract)
               KPI     var(--dvk-screen-kpi-height)     104px   (fixed by contract)
               main    minmax(0, 1fr)                            (fluid)
    Main       12 columns x minmax(0, 1fr), gutter var(--dvk-screen-grid-gutter) 24px
               left   span 3   rows minmax(0, 1fr) / minmax(0, 1.05fr)
               centre span 6   rows minmax(0, 1fr) / minmax(0, 240px)
               right  span 3   rows minmax(0, 1.3fr) / minmax(0, 1fr)
    Fluid      every main-region row is minmax(0, ...) and every column and panel
               carries min-height: 0 — no fixed px row can clip content.
    ========================================================================== -->

  <!-- ==========================================================================
    DECLARATION 2/4 — BLOCK LIST (pattern references)
    --------------------------------------------------------------------------
    header      P2 three-part header + P3 title bar (feature-detected)
    KPI row     P4 KPI strip, 4 cards
    left  1     P6+P7+P9    panel container + panel head + horizontal progress rows
    left  2     P6+P7+P10   panel container + panel head + rank / pressure rows
    centre 1    P6+P7+P17   primary view: map stage (P18 markers, P19 overlay card)
    centre 2    P12         rhythm bars (time slices)
    right  1    P6+P7+P11   triage cards
    right  2    P6+P7+P13   ring gauge
    metrics     P16         dvk-count-to for every animating number
    The right column uses two of the three allowed blocks (P11 / P15 / P13 x2-3).
    No chart slot exists in this skeleton: the P17 map stage is the visual lead,
    and P12 / P9 / P10 / P13 are DOM visualisations, not chart containers.
    ========================================================================== -->

  <!-- ==========================================================================
    DECLARATION 3/4 — COMPONENT CONSTRUCTION (tag + key attributes)
    --------------------------------------------------------------------------
    dvk-fit-screen      width="1920" height="1080" mode="contain"
                        align="center center" fit-target="viewport"
    dvk-border-box-15   P4 cards + P13 ring frame
                        background-color="var(--dvk-color-surface)"
    dvk-border-box-9    P9 panel, restrained static surface (P6 role)
                        background-color="var(--dvk-color-surface)"
    dvk-border-box-7    P10 panel, chamfered surface (P6 role)
                        background-color="var(--dvk-color-surface)"
    dvk-border-box-4    P17 primary view, focal primary view (P6 role), HUD, no background
    dvk-border-box-13   P12 strip, bottom carrier-spine frame (P6 role), HUD
    dvk-border-box-11   P11 triage, operational status rail (P6 role), HUD
    dvk-decoration-9    P3 fallback rails x2, left instance carries reverse,
                        height 60px, opacity 0.85
    dvk-decoration-8    P13 ring, dur="4", dvk-count-to in the default slot
    dvk-count-to        end-val / duration="1400" (P16: one duration per screen),
                        disabled under prefers-reduced-motion: reduce
    Panel titles live inside the default slot (P7 .panel-heading) — no border box
    has a #header or #title slot. The Title 4 variant does not exist and is never
    used: only dvk-title-1 / -2 / -3 are probed.
    ========================================================================== -->

  <!-- ==========================================================================
    DECLARATION 4/4 — PLACEHOLDER DATA SHAPE (inline JSON, #dvk-data)
    --------------------------------------------------------------------------
    {
      "header":  { "eyebrow": string, "title": string, "region": string,
                   "shift": string, "clock": string },
      "kpi":     [ { "label": string, "value": number, "unit": string } ] x4,
      "share":   [ { "label": string, "value": number } ] x4,
      "rank":    [ { "code": string, "name": string, "status": string,
                     "value": number } ] x3,
      "triage":  [ { "severity": "P1"|"P2"|"P3", "title": string,
                     "meta": string, "time": string } ] x3,
      "gauge":   { "label": string, "caption": string, "value": number },
      "rhythm":  [ { "time": string, "label": string, "value": number } ] x8
    }
    ========================================================================== -->

  <!-- ==========================================================================
    PERMISSION TIERS (issue 08 §3 — three tiers, unchanged by this file)
    --------------------------------------------------------------------------
    skeleton redline (changing one sends the work back to the prototype):
      row count, column count, primary-view position, header form, block add/remove
    recommended values (changeable, must be registered as a deviation):
      block proportions, spacing, density, decoration strength, theme
    free zone (changeable inside a block):
      pattern substitution, business copy, chart type and option, placeholder data
    ========================================================================== -->

  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/cyber-blue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/neon-magenta.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/matrix-green.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/solar-gold.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@datav-kit/themes@0.0.5/dist/ice-white.css">

  <script type="importmap">
    {
      "imports": {
        "@datav-kit/elements@0.0.5": "https://cdn.jsdelivr.net/npm/@datav-kit/elements@0.0.5/+esm"
      }
    }
  </script>
  <!-- CDN backup if jsDelivr +esm is unavailable:
       "@datav-kit/elements@0.0.5": "https://esm.sh/@datav-kit/elements@0.0.5" -->

  <style>
    html {
      /* The page ground is the active theme's surface colour over the UA dark
         canvas base. No colour literal is declared in this file. */
      color-scheme: dark;
      background-color: var(--dvk-page-ground, var(--dvk-color-surface));
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--dvk-screen-font-family);
    }

    .dvk-screen {
      /* Single colour source: every colour below derives from --dvk-color-*. */
      --dvk-text-strong: var(--dvk-color-primary);
      --dvk-text-muted: color-mix(in srgb, var(--dvk-color-primary) 64%, transparent);
      --dvk-text-faint: color-mix(in srgb, var(--dvk-color-primary) 38%, transparent);
      --dvk-rule: color-mix(in srgb, var(--dvk-color-primary) 20%, transparent);
      --dvk-fill-soft: color-mix(in srgb, var(--dvk-color-primary) 12%, transparent);
      --dvk-fill-mid: color-mix(in srgb, var(--dvk-color-primary) 22%, transparent);
      --dvk-surface-fill: color-mix(in srgb, var(--dvk-color-surface) 88%, transparent);

      position: relative;
      box-sizing: border-box;
      width: 1920px;
      height: 1080px;
      padding: var(--dvk-screen-safe-margin);
      display: grid;
      grid-template-rows:
        var(--dvk-screen-header-height)
        var(--dvk-screen-kpi-height)
        minmax(0, 1fr);
      gap: var(--dvk-screen-space-xl);
      color: var(--dvk-text-muted);
      font-size: var(--dvk-screen-font-size-xs);
      line-height: var(--dvk-screen-line-height-base);
      overflow: hidden;
    }

    .unit { font-size: var(--dvk-screen-font-size-sm); color: var(--dvk-text-faint); }

    /* ---------- P2 three-part header + P3 title bar ---------- */
    .screen-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: var(--dvk-screen-space-xl);
      min-height: 0;
      border-bottom: var(--dvk-line-width) solid var(--dvk-rule);
    }

    .header-info {
      display: grid;
      gap: var(--dvk-screen-space-xs);
      padding: var(--dvk-screen-space-lg) var(--dvk-screen-space-xl);
      border-left: 4px solid var(--dvk-color-accent);
      background: var(--dvk-surface-fill);
    }

    .header-info--right {
      justify-self: end;
      text-align: right;
      border-left: 0;
      border-right: 4px solid var(--dvk-color-secondary);
    }

    .header-info .label {
      font-size: var(--dvk-screen-font-size-xs);
      line-height: 1;
      color: var(--dvk-text-faint);
      letter-spacing: 0.12em;
    }

    .header-info .value {
      font-size: var(--dvk-screen-font-size-sm);
      font-weight: var(--dvk-screen-font-weight-medium);
      line-height: 1.2;
      color: var(--dvk-text-strong);
    }

    .title-rail {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: var(--dvk-screen-space-xl);
      min-width: 720px;
    }

    .rail {
      display: block;
      height: 60px;
      opacity: 0.85;
    }

    .title-block {
      padding: var(--dvk-screen-space-sm) var(--dvk-screen-space-2xl);
      text-align: center;
      border-top: var(--dvk-line-width) solid var(--dvk-rule);
      border-bottom: var(--dvk-line-width) solid var(--dvk-rule);
    }

    .title-block .eyebrow {
      display: block;
      font-size: var(--dvk-screen-font-size-xs);
      line-height: 1.2;
      letter-spacing: 0.24em;
      color: var(--dvk-text-faint);
    }

    .title-block h1 {
      margin: var(--dvk-screen-space-xs) 0 0;
      font-size: var(--dvk-screen-font-size-xl);
      font-weight: var(--dvk-screen-font-weight-bold);
      line-height: 1.1;
      color: var(--dvk-text-strong);
    }

    /* ---------- P4 KPI strip ---------- */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--dvk-screen-space-2xl);
      min-height: 0;
    }

    .kpi-strip > dvk-border-box-15 { min-width: 0; min-height: 0; }

    .kpi-card {
      display: grid;
      align-content: center;
      gap: var(--dvk-screen-space-xs);
      height: 100%;
    }

    .kpi-card .label {
      font-size: var(--dvk-screen-font-size-xs);
      line-height: 1.2;
      color: var(--dvk-text-muted);
    }

    .value-row { display: flex; align-items: baseline; gap: var(--dvk-screen-space-sm); }

    /* ---------- P5 main grid: 3 / 6 / 3 of 12 columns ---------- */
    .screen-main {
      display: grid;
      grid-template-columns: repeat(var(--dvk-screen-grid-columns), minmax(0, 1fr));
      gap: var(--dvk-screen-grid-gutter);
      min-height: 0;
    }

    .col { display: grid; gap: var(--dvk-screen-space-xl); min-height: 0; }
    .col > * { min-height: 0; }
    .col-left { grid-column: span 3; grid-template-rows: minmax(0, 1fr) minmax(0, 1.05fr); }
    .col-centre { grid-column: span 6; grid-template-rows: minmax(0, 1fr) minmax(0, 240px); }
    .col-right { grid-column: span 3; grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); }

    /* ---------- P6 + P7 panel container and head ---------- */
    .panel-inner {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: var(--dvk-screen-space-lg);
      height: 100%;
      min-height: 0;
    }

    .panel-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--dvk-screen-space-md);
    }

    .panel-heading .eyebrow {
      margin: 0;
      font-size: var(--dvk-screen-font-size-sm);
      line-height: 1.2;
      color: var(--dvk-text-faint);
      letter-spacing: 0.14em;
    }

    .panel-heading h3 {
      margin: 0;
      font-size: var(--dvk-screen-font-size-md);
      font-weight: var(--dvk-screen-font-weight-bold);
      line-height: 1.2;
      color: var(--dvk-text-strong);
    }

    .panel-heading--compact .eyebrow { display: none; }

    .chip {
      flex: 0 0 auto;
      padding: 5px 9px;
      border: var(--dvk-line-width) solid var(--dvk-rule);
      font-size: var(--dvk-screen-font-size-xs);
      line-height: 1.2;
      color: var(--dvk-color-accent);
      background: var(--dvk-fill-soft);
    }

    .panel-body { min-height: 0; overflow: hidden; }

    /* Registered deviation (components.md content-area rule): border-box-4's ornate
       top-left ornament intrudes past the automatic contentRect inset at this panel
       size, so the content inset is overridden to clear it — observed obstruction. */
    .panel--map {
      --dvk-border-box-4-padding:
        var(--dvk-screen-space-5xl)
        var(--dvk-screen-space-2xl)
        var(--dvk-screen-space-xl);
    }

    /* ---------- P9 horizontal progress row ---------- */
    .progress-list { display: grid; gap: var(--dvk-screen-space-lg); align-content: start; }

    .progress-row { display: grid; gap: var(--dvk-screen-space-sm); }

    .progress-row__head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--dvk-screen-space-md);
    }

    .bar {
      height: 8px;
      overflow: hidden;
      background: var(--dvk-fill-soft);
    }

    .bar > i {
      display: block;
      width: var(--bar-value);
      height: 100%;
      background: linear-gradient(90deg, var(--dvk-color-secondary), var(--dvk-color-primary));
    }

    /* ---------- P10 rank / pressure row ---------- */
    .rank-list { display: grid; gap: var(--dvk-screen-space-md); align-content: start; }

    .rank-row {
      display: grid;
      grid-template-columns: minmax(0, 150px) minmax(0, 1fr);
      align-items: center;
      gap: var(--dvk-screen-space-md);
      padding: var(--dvk-screen-space-md) var(--dvk-screen-space-lg);
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background: var(--dvk-surface-fill);
    }

    .rank-row .name-zone {
      display: flex;
      align-items: baseline;
      gap: var(--dvk-screen-space-sm);
      min-width: 0;
      white-space: nowrap;
    }

    .rank-row .code {
      font-size: var(--dvk-screen-font-size-md);
      font-weight: var(--dvk-screen-font-weight-bold);
      line-height: 1.2;
      color: var(--dvk-text-strong);
    }

    .rank-row .name {
      font-size: var(--dvk-screen-font-size-xs);
      color: var(--dvk-text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-row .status {
      justify-self: end;
      font-style: normal;
      font-size: var(--dvk-screen-font-size-xs);
      color: var(--dvk-color-accent);
    }

    .rank-row .bar { grid-column: 1 / -1; }

    /* ---------- P17 map stage + P18 markers + P19 overlay ---------- */
    .map-shell { display: grid; grid-template-rows: minmax(0, 1fr); height: 100%; min-height: 0; }

    .map-container {
      position: relative;
      overflow: hidden;
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background-image:
        linear-gradient(var(--dvk-rule) var(--dvk-line-width), transparent var(--dvk-line-width)),
        linear-gradient(90deg, var(--dvk-rule) var(--dvk-line-width), transparent var(--dvk-line-width));
      background-size: 42px 42px;
      min-height: 0;
    }

    .map-container svg {
      position: absolute;
      inset: 24px 32px;
      width: calc(100% - 64px);
      height: calc(100% - 48px);
    }

    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      display: grid;
      justify-items: center;
      gap: var(--dvk-screen-space-xs);
      min-width: 88px;
      pointer-events: none;
    }

    .marker i {
      width: 14px;
      height: 14px;
      border: 2px solid var(--dvk-color-primary);
      background: var(--dvk-color-secondary);
      transform: rotate(45deg);
      box-shadow: var(--dvk-glow-soft);
    }

    .marker strong { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-strong); }
    .marker span { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-faint); }

    .map-overlay {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 320px;
      padding: var(--dvk-screen-space-lg);
      border: var(--dvk-line-width) solid var(--dvk-color-accent);
      background: var(--dvk-surface-fill);
    }

    .map-overlay .eyebrow { display: block; font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-faint); }
    .map-overlay strong { display: block; font-size: var(--dvk-screen-font-size-sm); color: var(--dvk-color-accent); }
    .map-overlay p { margin: var(--dvk-screen-space-xs) 0 0; font-size: var(--dvk-screen-font-size-xs); }

    /* ---------- P12 rhythm bars ---------- */
    .rhythm {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: var(--dvk-screen-space-md);
      height: 100%;
      min-height: 0;
    }

    .rhythm__slice { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--dvk-screen-space-xs); min-height: 0; }
    .rhythm__slice time { font-size: var(--dvk-screen-font-size-xs); line-height: 1.2; color: var(--dvk-text-muted); }

    .rhythm__slot {
      display: flex;
      align-items: flex-end;
      min-height: 72px;
      min-width: 0;
      background: var(--dvk-fill-soft);
    }

    .rhythm__slot > i {
      display: block;
      width: 100%;
      height: var(--bar-value);
      background: linear-gradient(0deg, var(--dvk-color-secondary), var(--dvk-color-primary));
    }

    .rhythm__slice span { font-size: var(--dvk-screen-font-size-xs); line-height: 1.2; color: var(--dvk-text-faint); }

    /* ---------- P11 triage card ---------- */
    .triage-list { display: grid; gap: var(--dvk-screen-space-md); align-content: start; }

    .triage-card {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 52px;
      align-items: center;
      gap: var(--dvk-screen-space-md);
      padding: var(--dvk-screen-space-md) var(--dvk-screen-space-lg);
      border-left: 3px solid var(--dvk-color-accent);
      background: var(--dvk-surface-fill);
    }

    .triage-card[data-severity='P2'] { border-left-color: var(--dvk-color-secondary); }
    .triage-card[data-severity='P3'] { border-left-color: var(--dvk-color-primary); }

    .triage-card .badge {
      font-weight: var(--dvk-screen-font-weight-bold);
      font-size: var(--dvk-screen-font-size-sm);
      color: var(--dvk-text-strong);
    }

    .triage-card .text { display: grid; gap: 2px; min-width: 0; }
    .triage-card .text strong { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-strong); }
    .triage-card .text span { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-faint); }
    .triage-card time { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-muted); text-align: right; }

    /* ---------- P13 ring gauge ---------- */
    .ring {
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      align-items: center;
      gap: var(--dvk-screen-space-lg);
      height: 100%;
      min-height: 0;
    }

    .ring__gauge { width: 128px; height: 128px; }

    .ring__gauge dvk-count-to {
      --dvk-count-to-font-size: var(--dvk-screen-font-size-sm);
      --dvk-count-to-font-weight: var(--dvk-screen-font-weight-bold);
      /* em resolves against the host's inherited size (14px), so the affix ratio is
         expressed against the count-to font size instead. */
      --dvk-count-to-affix-font-size: calc(var(--dvk-screen-font-size-sm) * 0.58);
      --dvk-count-to-color: var(--dvk-text-strong);
    }

    .ring__caption { display: grid; gap: var(--dvk-screen-space-xs); }
    .ring__caption span { font-size: var(--dvk-screen-font-size-xs); color: var(--dvk-text-faint); }
    .ring__caption strong { font-size: var(--dvk-screen-font-size-sm); color: var(--dvk-text-strong); }

    /* ---------- P16 count-to sizing (host-level, not per instance) ---------- */
    .kpi-card dvk-count-to {
      --dvk-count-to-font-size: var(--dvk-screen-font-size-lg);
      --dvk-count-to-color: var(--dvk-text-strong);
    }

    .progress-row dvk-count-to {
      --dvk-count-to-font-size: var(--dvk-screen-font-size-sm);
      --dvk-count-to-color: var(--dvk-text-strong);
      --dvk-count-to-affix-font-size: calc(var(--dvk-screen-font-size-sm) * 0.75);
    }

    /* ---------- demo-only theme switcher (outside the 1920x1080 canvas) ---------- */
    .demo-controls {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background: var(--dvk-surface-fill);
      font-size: var(--dvk-screen-font-size-xs);
    }

    .demo-controls button {
      padding: 4px 10px;
      border: var(--dvk-line-width) solid var(--dvk-rule);
      background: transparent;
      color: var(--dvk-text-muted);
      font: inherit;
      cursor: pointer;
    }

    .demo-controls button.is-active { color: var(--dvk-text-strong); background: var(--dvk-fill-mid); }
  </style>
</head>

<body>
  <!-- Demo-only control: switches the single theme class on the screen root.
     It sits outside the 1920x1080 canvas, so the screen skeleton is untouched. -->
  <div class="demo-controls" role="group" aria-label="主题切换">
    <span>THEME</span>
    <button type="button" data-theme="cyber-blue">cyber-blue</button>
    <button type="button" data-theme="neon-magenta">neon-magenta</button>
    <button type="button" data-theme="matrix-green">matrix-green</button>
    <button type="button" data-theme="solar-gold">solar-gold</button>
    <button type="button" data-theme="ice-white">ice-white</button>
  </div>

  <dvk-fit-screen width="1920" height="1080" mode="contain" align="center center" fit-target="viewport">
    <div class="dvk-screen dvk-theme-cyber-blue" id="screen">

      <header class="screen-header">
        <div class="header-info">
          <span class="label">REGION</span>
          <strong class="value" data-bind="header.region"></strong>
        </div>
        <div class="title-group" id="title-group"></div>
        <div class="header-info header-info--right">
          <span class="label">SHIFT / CLOCK</span>
          <strong class="value" data-bind="header.shift"></strong>
        </div>
      </header>

                        <stop offset="0%" stop-color="var(--dvk-color-primary)" stop-opacity="0.9"></stop>

                    </defs>
                    <path d="M60 300 L200 210 L340 250 L470 150 L620 190 L740 120" fill="none" stroke="url(#t1-flow)" stroke-width="2.25" stroke-dasharray="6 8"></path>
                    <path d="M120 120 L260 160 L400 110 L540 200 L700 280" fill="none" stroke="var(--dvk-color-secondary)" stroke-width="1.5" stroke-opacity="0.6"></path>
                    <path d="M60 300 L120 120 M340 250 L400 110 M470 150 L540 200" fill="none" stroke="var(--dvk-color-primary)" stroke-width="1" stroke-opacity="0.35"></path>
                  </svg>
                </div>

          </dvk-border-box-4>

          <dvk-border-box-13>
            <div class="panel-inner">
              <header class="panel-heading panel-heading--compact">
                <div>
                  <h3>时段强度</h3>
                </div>
                <span class="chip">08:00 – 15:00</span>
              </header>
              <div class="panel-body"><div class="rhythm" id="rhythm"></div></div>
            </div>
          </dvk-border-box-13>
        </div>

        <div class="col col-right">
          <dvk-border-box-11>
            <div class="panel-inner">
              <header class="panel-heading panel-heading--compact">
                <div>
                  <h3>调度队列</h3>
                </div>
                <span class="chip">3 项</span>
              </header>
              <div class="panel-body"><div class="triage-list" id="triage-list"></div></div>
            </div>
          </dvk-border-box-11>

          <dvk-border-box-15 background-color="var(--dvk-color-surface)">
            <div class="panel-inner">
              <header class="panel-heading panel-heading--compact">
                <div>
                  <h3>同步率</h3>
                </div>
              </header>
              <div class="panel-body">
                <div class="ring">
                  <dvk-decoration-8 class="ring__gauge" dur="4">
                    <dvk-count-to id="ring-value"></dvk-count-to>
                  </dvk-decoration-8>
                  <div class="ring__caption">
                    <span data-bind="gauge.caption"></span>
                    <strong data-bind="gauge.label"></strong>
                  </div>
                </div>
              </div>
            </div>
          </dvk-border-box-15>
        </div>
      </main>
    </div>
  </dvk-fit-screen>

  <script type="module">
    import { register } from '@datav-kit/elements@0.0.5'

    const THEMES = ['cyber-blue', 'neon-magenta', 'matrix-green', 'solar-gold', 'ice-white']
    const COUNT_DURATION = 1400 // P16: one count-up duration per screen
    const data = JSON.parse(document.querySelector('#dvk-data').textContent)
    const screen = document.querySelector('#screen')
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches

    register()

    /* P3 title bar: feature-detect the component, otherwise build the P3 fallback. */
    function mountTitle() {
      const group = document.querySelector('#title-group')
      // The Title 4 variant does not exist; only 1-3 are ever probed.
      const tag = ['dvk-title-1', 'dvk-title-2', 'dvk-title-3'].find(name => customElements.get(name))

      if (tag) {
        const el = document.createElement(tag)
        el.setAttribute('title-text', data.header.title)
        group.append(el)
        group.dataset.titlePath = 'component'
        return
      }

      const rail = document.createElement('div')
      rail.className = 'title-rail'
      rail.innerHTML = `
        <dvk-decoration-9 class="rail" reverse></dvk-decoration-9>
        <div class="title-block">
          <span class="eyebrow">${data.header.eyebrow}</span>
          <h1>${data.header.title}</h1>
        </div>
        <dvk-decoration-9 class="rail"></dvk-decoration-9>`
      group.append(rail)
      group.dataset.titlePath = 'p3-fallback'
    }

    function renderKpi() {
      document.querySelector('#kpi-strip').innerHTML = data.kpi.map(item => `
        <dvk-border-box-15 background-color="var(--dvk-color-surface)">
          <div class="kpi-card">
            <span class="label">${item.label}</span>
            <span class="value-row">
              <dvk-count-to end-val="${item.value}" duration="${COUNT_DURATION}"></dvk-count-to>
              <span class="unit">${item.unit}</span>
            </span>
          </div>
        </dvk-border-box-15>`).join('')
    }

    function renderShare() {
      document.querySelector('#share-list').innerHTML = data.share.map(item => `
        <div class="progress-row">
          <div class="progress-row__head">
            <span>${item.label}</span>
            <dvk-count-to end-val="${item.value}" suffix="%" duration="${COUNT_DURATION}"></dvk-count-to>
          </div>
          <div class="bar"><i style="--bar-value: ${item.value}%"></i></div>
        </div>`).join('')
    }

    function renderRank() {
      document.querySelector('#rank-list').innerHTML = data.rank.map(item => `
        <article class="rank-row">
          <span class="name-zone">
            <strong class="code">${item.code}</strong>
            <span class="name">${item.name}</span>
          </span>
          <em class="status">${item.status}</em>
          <div class="bar"><i style="--bar-value: ${item.value}%"></i></div>
        </article>`).join('')
    }

    function renderRhythm() {
      document.querySelector('#rhythm').innerHTML = data.rhythm.map(item => `
        <article class="rhythm__slice">
          <time>${item.time}</time>
          <div class="rhythm__slot"><i style="--bar-value: ${item.value}%"></i></div>
          <span>${item.label}</span>
        </article>`).join('')
    }

    function renderTriage() {
      document.querySelector('#triage-list').innerHTML = data.triage.map(item => `
        <article class="triage-card" data-severity="${item.severity}">
          <b class="badge">${item.severity}</b>
          <div class="text">
            <strong>${item.title}</strong>
            <span>${item.meta}</span>
          </div>
          <time>${item.time}</time>
        </article>`).join('')
    }

    function renderGauge() {
      const el = document.querySelector('#ring-value')
      el.setAttribute('end-val', String(data.gauge.value))
      el.setAttribute('suffix', '%')
      el.setAttribute('duration', String(COUNT_DURATION))
    }

    function renderMarkers() {
      const container = document.querySelector('#map-container')
      const markers = [
        { left: '26%', top: '42%', code: 'SH-01', name: '浦东' },
        { left: '48%', top: '26%', code: 'SH-04', name: '徐汇' },
        { left: '60%', top: '34%', code: 'SH-07', name: '临港' }
      ]
      container.insertAdjacentHTML('beforeend', markers.map(item => `
        <div class="marker" style="left: ${item.left}; top: ${item.top}">
          <i></i>
          <strong>${item.code}</strong>
          <span>${item.name}</span>
        </div>`).join(''))

      container.insertAdjacentHTML('beforeend', `
        <section class="map-overlay">
          <span class="eyebrow">CONCLUSION</span>
          <strong>3 个枢纽负载均衡</strong>
          <p>浦东链路压力最高，已自动分流至徐汇备份链路。</p>
        </section>`)
    }

    function bindStaticText() {
      document.querySelectorAll('[data-bind]').forEach((el) => {
        const path = el.dataset.bind.split('.')
        el.textContent = path.reduce((node, key) => node[key], data)
      })
    }

    /* One theme per screen: exactly one .dvk-theme-* class on the screen root. */
    function applyTheme(name) {
      THEMES.forEach(theme => screen.classList.remove(`dvk-theme-${theme}`))
      screen.classList.add(`dvk-theme-${name}`)
      document.documentElement.style.setProperty(
        '--dvk-page-ground',
        getComputedStyle(screen).getPropertyValue('--dvk-color-surface').trim(),
      )
      document.querySelectorAll('[data-theme]').forEach((button) => {
        button.classList.toggle('is-active', button.dataset.theme === name)
      })
    }

    function applyReducedMotion() {
      if (!reduceMotion) return
      document.querySelectorAll('dvk-count-to').forEach(el => el.setAttribute('disabled', ''))
      document.querySelectorAll('dvk-decoration-8').forEach(el => el.setAttribute('paused', ''))
    }

    mountTitle()
    bindStaticText()
    renderKpi()
    renderShare()
    renderRank()
    renderRhythm()
    renderTriage()
    renderGauge()
    renderMarkers()

    /* Theme tokens are read with getComputedStyle, so the themed boot waits for the
       external theme stylesheets to finish loading — a module script can run before
       a CDN stylesheet has been applied, which would yield empty token values. */
    function boot() {
      applyTheme('cyber-blue')
      applyReducedMotion()
    }

    if (document.readyState === 'complete') boot()
    else window.addEventListener('load', boot, { once: true })

    document.querySelectorAll('[data-theme]').forEach((button) => {
      button.addEventListener('click', () => applyTheme(button.dataset.theme))
    })
  </script>
