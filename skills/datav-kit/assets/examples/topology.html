<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="数据中心设备拓扑：分层网络、链路负载、告警与设备详情联动。"
    />
    <title>云枢网络 · 连接态势</title>
    <script type="importmap">
      {
        "imports": {
          "@datav-kit/elements": "https://cdn.jsdelivr.net/npm/@datav-kit/elements@0.0.5/+esm",
          "echarts": "https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.esm.min.js",
          "lucide": "https://cdn.jsdelivr.net/npm/lucide@0.468.0/+esm"
        }
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #19191d;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button,
      select {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button {
        border: 0;
        background: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
      }
      button:disabled {
        cursor: default;
      }
      button svg {
        width: 22px;
        height: 22px;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--app-selected);
        outline-offset: 4px;
      }
      svg {
        display: block;
      }
      [hidden] {
        display: none !important;
      }
      #screen {
        --app-background: #19191d;
        --app-surface: #27272f;
        --app-text: #f3f1f6;
        --app-muted: #bfbcc9;
        --app-rule: #4a4753;
        --app-selected: #e6a1d0;
        --app-positive: #8ed8ce;
        --app-warning: #f2c57e;
        --app-danger: #ff959d;
        --app-link: #858391;
        --app-series: #8ed8ce;
        --dvk-color-primary: #e6a1d0;
        --dvk-color-secondary: #8ed8ce;
        width: 1920px;
        height: 1080px;
        background: var(--app-background);
        color: var(--app-text);
        font:
          21px/1.5 'Inter',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
        padding: 30px 44px 22px;
        display: grid;
        grid-template-rows: 92px minmax(0, 1fr) 28px;
        gap: 24px;
        position: relative;
      }
      .screen-header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        border-bottom: 1px solid var(--app-rule);
        padding-bottom: 22px;
        gap: 40px;
      }
      .header-side {
        display: flex;
        gap: 16px;
        align-items: center;
        font-size: 18px;
      }
      .header-side > svg {
        color: var(--app-positive);
        width: 36px;
        height: 36px;
      }
      .header-side:last-child {
        justify-content: end;
        text-align: right;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 26px;
        text-align: center;
      }
      .title dvk-decoration-6 {
        display: block;
        width: 148px;
        height: 32px;
      }
      h1 {
        font-size: 34px;
        font-weight: 600;
      }
      .eyebrow {
        font-size: 14px;
        color: var(--app-muted);
      }
      #status {
        font-size: 16px;
        color: var(--app-positive);
      }
      [data-state='stale'] #status {
        color: var(--app-warning);
      }
      main {
        display: grid;
        grid-template-rows: minmax(0, 1fr) 206px;
        gap: 28px;
        min-height: 0;
      }
      .workbench {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        gap: 40px;
        min-height: 0;
      }
      .health {
        border-right: 1px solid var(--app-rule);
        padding-right: 30px;
        min-height: 0;
      }
      .health h2 {
        font-size: 23px;
        font-weight: 500;
      }
      .health-value {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-top: 8px;
      }
      .health-value strong {
        font-size: 74px;
        font-weight: 500;
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
      }
      .health-value span {
        font-size: 19px;
        color: var(--app-muted);
      }
      .health-summary {
        font-size: 17px;
        color: var(--app-positive);
      }
      .health-rows {
        margin: 20px 0 24px;
      }
      .health-rows div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--app-rule);
        padding: 9px 0;
        font-size: 18px;
      }
      .health-rows span {
        color: var(--app-muted);
      }
      .health-rows strong {
        font-weight: 500;
      }
      .alert {
        text-align: left;
        justify-content: start;
        display: block;
        width: 100%;
        padding: 12px 0 12px 14px;
        margin-top: 12px;
        border-left: 3px solid var(--app-warning);
        font-size: 16px;
        line-height: 1.4;
      }
      .alert:last-child {
        border-color: var(--app-danger);
      }
      .alert time {
        color: var(--app-muted);
        font-size: 15px;
      }
      .alert strong {
        display: block;
        font-size: 19px;
        font-weight: 500;
        margin: 6px 0;
      }
      .alert span {
        color: var(--app-warning);
        font-size: 16px;
      }
      .alert:last-child span {
        color: var(--app-danger);
      }
      .network {
        display: grid;
        grid-template-rows: 54px 40px minmax(0, 1fr) 30px;
        gap: 12px;
        min-height: 0;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .filters {
        display: flex;
        gap: 22px;
      }
      .filters button {
        font-size: 18px;
        padding: 8px 0;
        border-bottom: 2px solid transparent;
        color: var(--app-muted);
      }
      .filters button[aria-pressed='true'] {
        color: var(--app-selected);
        border-color: var(--app-selected);
      }
      .select-device {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 17px;
        color: var(--app-muted);
      }
      select {
        width: 236px;
        height: 42px;
        border: 1px solid var(--app-rule);
        background: var(--app-surface);
        color: var(--app-text);
        padding: 4px 10px;
        font-size: 17px;
      }
      .layer-headings {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        text-align: center;
        font-size: 16px;
        color: var(--app-muted);
      }
      .layer-headings span {
        border-top: 1px solid var(--app-rule);
        padding-top: 10px;
        margin: 0 20px;
      }
      #network-chart {
        min-height: 0;
        width: 100%;
        height: 100%;
      }
      .network-legend {
        display: flex;
        justify-content: center;
        gap: 36px;
        color: var(--app-muted);
        font-size: 15px;
      }
      .network-legend span {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }
      .network-legend i {
        width: 9px;
        height: 9px;
        background: var(--app-positive);
      }
      .network-legend span:nth-child(2) i {
        background: var(--app-warning);
      }
      .network-legend span:nth-child(3) i {
        background: var(--app-danger);
      }
      .detail {
        border-top: 2px solid var(--app-selected);
        padding: 22px 0 0;
        display: grid;
        grid-template-columns: 310px 1fr 460px;
        gap: 40px;
        min-height: 0;
      }
      .device-identity h2 {
        font-size: 31px;
        font-weight: 500;
        margin: 6px 0;
      }
      #device-state {
        font-size: 17px;
      }
      .detail dl {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        margin: 0;
      }
      .detail dt {
        font-size: 17px;
        color: var(--app-muted);
      }
      .detail dd {
        font-size: 38px;
        font-weight: 500;
        margin: 6px 0 0;
        font-variant-numeric: tabular-nums;
      }
      .detail dd small {
        font-size: 18px;
        color: var(--app-muted);
      }
      .detail-note {
        font-size: 16px;
        color: var(--app-muted);
        margin-top: 20px;
      }
      .traffic h3 {
        font-size: 18px;
        font-weight: 500;
      }
      #traffic-chart {
        width: 100%;
        height: 136px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: var(--app-muted);
      }
      .state-layer {
        position: absolute;
        inset: 146px 44px 72px;
        background: var(--app-background);
        display: none;
        place-content: center;
        text-align: center;
        gap: 18px;
      }
      .state-layer h2 {
        font-size: 32px;
      }
      .state-layer p {
        color: var(--app-muted);
      }
      .state-layer button {
        color: var(--app-selected);
        padding: 14px;
        justify-self: center;
      }
      #screen:is(
          [data-state='loading'],
          [data-state='empty'],
          [data-state='failed']
        )
        main {
        visibility: hidden;
      }
      #screen:is(
          [data-state='loading'],
          [data-state='empty'],
          [data-state='failed']
        )
        .state-layer {
        display: grid;
      }
    </style>
  </head>
  <body>
    <dvk-fit-screen
      width="1920"
      height="1080"
      mode="contain"
      align="center center"
    >
      <div
        id="screen"
        class="dvk-screen"
        data-state="loading"
        data-scene="topology"
        data-layout="topology-layered"
        data-palette="graphite-magenta"
      >
        <header class="screen-header">
          <div class="header-side">
            <i data-lucide="network"></i>
            <div>
              华东数据中心
              <p class="eyebrow">DC-SH-01 / PRODUCTION</p>
            </div>
          </div>
          <div class="title">
            <dvk-decoration-6 aria-hidden="true"></dvk-decoration-6>
            <div>
              <h1>云枢网络 · 连接态势</h1>
              <p class="eyebrow">NETWORK OPERATIONS</p>
            </div>
            <dvk-decoration-6 reverse aria-hidden="true"></dvk-decoration-6>
          </div>
          <div class="header-side">
            <div>
              <time>2026.09.09 14:30:00</time>
              <p id="status">正在加载</p>
            </div>
          </div>
        </header>
        <main>
          <div class="workbench">
            <aside class="health" aria-label="网络健康与告警">
              <h2>设备在线</h2>
              <div class="health-value">
                <strong id="online-count"></strong
                ><span id="device-count"></span>
              </div>
              <p class="health-summary" id="health-summary"></p>
              <div class="health-rows">
                <div>
                  <span>活动链路</span><strong id="link-count"></strong>
                </div>
                <div>
                  <span>需关注设备</span><strong id="attention-count"></strong>
                </div>
                <div>
                  <span>平均在线负载</span><strong id="average-load"></strong>
                </div>
              </div>
              <h2>当前告警</h2>
              <button class="alert" data-alert="edge-b">
                <time>14:26 / 性能告警</time><strong>接入交换机 B</strong
                ><span>端口负载超过阈值</span>
              </button>
              <button class="alert" data-alert="sensor">
                <time>14:18 / 连接告警</time><strong>环境监测终端</strong
                ><span>心跳中断 · 已离线</span>
              </button>
            </aside>
            <section
              class="network"
              aria-label="设备连接拓扑"
              data-primary-visual
            >
              <div class="toolbar">
                <div class="filters" role="group" aria-label="拓扑视图">
                  <button data-filter="all" aria-pressed="true">全部连接</button
                  ><button data-filter="attention" aria-pressed="false">
                    异常关联
                  </button>
                </div>
                <label class="select-device"
                  >设备定位<select
                    id="device-select"
                    aria-label="设备定位"
                  ></select
                ></label>
              </div>
              <div class="layer-headings">
                <span>01 / 出口</span><span>02 / 核心</span
                ><span>03 / 接入</span><span>04 / 终端</span>
              </div>
              <div
                id="network-chart"
                data-chart
                aria-label="出口到终端的分层设备拓扑"
              ></div>
              <div class="network-legend">
                <span><i></i>正常</span><span><i></i>高负载</span
                ><span><i></i>离线 / 虚线链路</span
                ><span>链路标注：实时 Mbps →</span>
              </div>
            </section>
          </div>
          <section class="detail" aria-label="选中设备详情">
            <div class="device-identity">
              <p class="eyebrow" id="device-code"></p>
              <h2 id="device-name"></h2>
              <p id="device-state"></p>
            </div>
            <div>
              <dl>
                <div>
                  <dt>端口负载</dt>
                  <dd><span id="device-load"></span><small> %</small></dd>
                </div>
                <div>
                  <dt>响应延迟</dt>
                  <dd><span id="device-latency"></span><small> ms</small></dd>
                </div>
                <div>
                  <dt>关联链路</dt>
                  <dd id="device-links"></dd>
                </div>
              </dl>
              <p class="detail-note" id="device-note"></p>
            </div>
            <div class="traffic">
              <h3>设备吞吐 · 最近 8 分钟 / Mbps</h3>
              <div
                id="traffic-chart"
                data-chart
                aria-label="设备吞吐变化"
              ></div>
            </div>
          </section>
        </main>
        <footer>
          <span>网络结构与指标为演示数据 · 更新于 14:30</span
          ><span>状态采样 10 s / 链路从出口指向终端</span>
        </footer>
        <section class="state-layer" role="status">
          <h2 id="state-title">正在加载连接态势</h2>
          <p id="state-message"></p>
          <button id="retry" hidden>
            <i data-lucide="refresh-cw"></i>重新加载
          </button>
        </section>
      </div>
    </dvk-fit-screen>
    <script type="module">
      const screen = document.querySelector('#screen')
      const params = new URLSearchParams(location.search)
      const reduced = matchMedia('(prefers-reduced-motion: reduce)')
      const color = (role) =>
        getComputedStyle(screen).getPropertyValue(`--app-${role}`).trim()
      const devices = [
        {
          id: 'gateway',
          name: '出口网关',
          code: 'GW-01',
          x: 0,
          y: 180,
          state: 'normal',
          load: 42,
          latency: 4,
          traffic: [340, 360, 328, 420, 380, 410, 436, 428],
        },
        {
          id: 'core-a',
          name: '核心交换机 A',
          code: 'CORE-01',
          x: 300,
          y: 80,
          state: 'normal',
          load: 56,
          latency: 2,
          traffic: [210, 224, 208, 240, 234, 256, 262, 248],
        },
        {
          id: 'core-b',
          name: '核心交换机 B',
          code: 'CORE-02',
          x: 300,
          y: 290,
          state: 'normal',
          load: 38,
          latency: 2,
          traffic: [130, 136, 120, 180, 146, 154, 174, 180],
        },
        {
          id: 'edge-a',
          name: '接入交换机 A',
          code: 'EDGE-01',
          x: 600,
          y: 40,
          state: 'normal',
          load: 36,
          latency: 3,
          traffic: [140, 152, 140, 160, 156, 168, 182, 160],
        },
        {
          id: 'edge-b',
          name: '接入交换机 B',
          code: 'EDGE-02',
          x: 600,
          y: 185,
          state: 'warning',
          load: 92,
          latency: 18,
          traffic: [52, 68, 71, 84, 86, 93, 89, 88],
        },
        {
          id: 'edge-c',
          name: '接入交换机 C',
          code: 'EDGE-03',
          x: 600,
          y: 330,
          state: 'normal',
          load: 41,
          latency: 3,
          traffic: [130, 136, 120, 180, 146, 154, 174, 180],
        },
        {
          id: 'compute',
          name: '计算集群',
          code: 'APP-01',
          x: 900,
          y: 0,
          state: 'normal',
          load: 62,
          latency: 5,
          traffic: [90, 104, 89, 100, 98, 110, 114, 108],
        },
        {
          id: 'storage',
          name: '存储阵列',
          code: 'SAN-01',
          x: 900,
          y: 92,
          state: 'normal',
          load: 34,
          latency: 3,
          traffic: [50, 48, 51, 60, 58, 58, 68, 52],
        },
        {
          id: 'camera',
          name: '视频终端',
          code: 'CAM-01',
          x: 900,
          y: 205,
          state: 'normal',
          load: 72,
          latency: 12,
          traffic: [52, 68, 71, 84, 86, 93, 89, 88],
        },
        {
          id: 'sensor',
          name: '环境监测终端',
          code: 'IOT-01',
          x: 900,
          y: 302,
          state: 'offline',
          load: null,
          latency: null,
          traffic: [null, null, null, null, null, null, null, null],
        },
        {
          id: 'backup',
          name: '备份节点',
          code: 'BAK-01',
          x: 900,
          y: 395,
          state: 'normal',
          load: 28,
          latency: 4,
          traffic: [130, 136, 120, 180, 146, 154, 174, 180],
        },
      ]
      const links = [
        ['gateway', 'core-a', 248],
        ['gateway', 'core-b', 180],
        ['core-a', 'edge-a', 160],
        ['core-a', 'edge-b', 88],
        ['core-b', 'edge-c', 180],
        ['edge-a', 'compute', 108],
        ['edge-a', 'storage', 52],
        ['edge-b', 'camera', 88],
        ['edge-c', 'sensor', null],
        ['edge-c', 'backup', 180],
      ]
      const labels = { normal: '正常', warning: '高负载', offline: '离线' }
      const roles = {
        normal: 'positive',
        warning: 'warning',
        offline: 'danger',
      }
      let graph,
        traffic,
        observer,
        resizeFrame,
        retryTimer,
        selected = 'edge-b',
        filter = 'all'
      function setState(value) {
        const state = ['loading', 'empty', 'failed', 'stale'].includes(value)
          ? value
          : 'ready'
        screen.dataset.state = state
        document.querySelector('#status').textContent = {
          ready: '连接数据已同步',
          loading: '正在加载',
          empty: '暂无数据',
          failed: '同步失败',
          stale: '数据已过期 · 保留上次结果',
        }[state]
        document.querySelector('#state-title').textContent =
          {
            loading: '正在加载连接态势',
            empty: '当前网络暂无数据',
            failed: '连接态势加载失败',
          }[state] || ''
        document.querySelector('#state-message').textContent =
          '华东数据中心 · 2026.09.09 14:30'
        document.querySelector('#retry').hidden = !['empty', 'failed'].includes(
          state,
        )
        screen.querySelectorAll('main button, main select').forEach((el) => {
          el.disabled = !['ready', 'stale'].includes(state)
        })
      }
      function renderGraph() {
        const attention = new Set(
          devices.filter((d) => d.state !== 'normal').map((d) => d.id),
        )
        const related = new Set(attention)
        links.forEach(([source, target]) => {
          if (attention.has(source) || attention.has(target)) {
            related.add(source)
            related.add(target)
          }
        })
        screen.dataset.filter = filter
        screen
          .querySelectorAll('[data-filter]')
          .forEach((button) =>
            button.setAttribute(
              'aria-pressed',
              String(button.dataset.filter === filter),
            ),
          )
        graph.setOption({
          animation: !reduced.matches,
          animationDuration: 250,
          animationDurationUpdate: 250,
          series: [
            {
              type: 'graph',
              layout: 'none',
              left: 160,
              right: 160,
              top: 50,
              bottom: 48,
              roam: false,
              symbol: 'rect',
              symbolSize: [156, 62],
              edgeSymbol: ['none', 'arrow'],
              edgeSymbolSize: 9,
              label: {
                show: true,
                position: 'inside',
                color: color('text'),
                fontSize: 16,
                lineHeight: 24,
                formatter: (item) =>
                  `${item.data.name}\n{status|${labels[item.data.health]}}`,
                rich: { status: { fontSize: 13, color: color('muted') } },
              },
              edgeLabel: {
                show: true,
                fontSize: 13,
                color: color('muted'),
                formatter: (item) =>
                  item.data.value === null ? '离线' : `${item.data.value} Mbps`,
                backgroundColor: color('background'),
                padding: 3,
              },
              emphasis: { focus: 'adjacency', scale: false },
              data: devices.map((d) => ({
                id: d.id,
                name: d.name,
                x: d.x,
                y: d.y,
                health: d.state,
                itemStyle: {
                  color: color('surface'),
                  borderColor: color(
                    d.id === selected ? 'selected' : roles[d.state],
                  ),
                  borderWidth: d.id === selected ? 3 : 1.5,
                  opacity:
                    filter === 'attention' && !related.has(d.id) ? 0.25 : 1,
                },
              })),
              links: links.map(([source, target, value]) => ({
                source,
                target,
                value,
                lineStyle: {
                  color: color(
                    value === null
                      ? 'danger'
                      : attention.has(source) || attention.has(target)
                        ? 'warning'
                        : 'link',
                  ),
                  width: 2,
                  type: value === null ? 'dashed' : 'solid',
                  curveness: 0,
                  opacity:
                    filter === 'attention' &&
                    !attention.has(source) &&
                    !attention.has(target)
                      ? 0.15
                      : 0.9,
                },
              })),
            },
          ],
        })
      }
      function selectDevice(id) {
        const device = devices.find((d) => d.id === id)
        selected = id
        screen.dataset.device = id
        document.querySelector('#device-select').value = id
        document.querySelector('#device-code').textContent = device.code
        document.querySelector('#device-name').textContent = device.name
        document.querySelector('#device-state').textContent =
          `${labels[device.state]} · ${device.state === 'offline' ? '最近心跳 14:18:00' : '最近心跳 14:30:00'}`
        document.querySelector('#device-state').style.color = color(
          roles[device.state],
        )
        document.querySelector('#device-load').textContent = device.load ?? '--'
        document.querySelector('#device-latency').textContent =
          device.latency ?? '--'
        document.querySelector('#device-links').textContent = links.filter(
          ([a, b]) => a === id || b === id,
        ).length
        document.querySelector('#device-note').textContent =
          device.state === 'offline'
            ? '心跳中断，当前负载与延迟未知；等待设备恢复。'
            : device.state === 'warning'
              ? '端口负载 92%，超过 85% 告警阈值；建议核查视频流量。'
              : '设备运行正常，关联链路均在监测范围内。'
        traffic.setOption({
          animation: !reduced.matches,
          animationDuration: 250,
          grid: { left: 36, right: 12, top: 18, bottom: 25 },
          xAxis: {
            type: 'category',
            data: [
              '14:23',
              '14:24',
              '14:25',
              '14:26',
              '14:27',
              '14:28',
              '14:29',
              '14:30',
            ],
            axisLine: { lineStyle: { color: color('rule') } },
            axisTick: { show: false },
            axisLabel: { color: color('muted'), fontSize: 12, interval: 2 },
          },
          yAxis: {
            type: 'value',
            min: 0,
            splitNumber: 2,
            axisLabel: { color: color('muted'), fontSize: 12 },
            splitLine: { lineStyle: { color: color('rule') } },
          },
          graphic: {
            elements: [
              {
                id: 'no-signal',
                type: 'text',
                left: 'center',
                top: 'middle',
                invisible: device.state !== 'offline',
                style: {
                  text: '暂无实时吞吐',
                  fill: color('muted'),
                  fontSize: 17,
                },
              },
            ],
          },
          series: [
            {
              type: 'line',
              data: device.traffic,
              showSymbol: true,
              symbolSize: 5,
              lineStyle: { color: color('series'), width: 2 },
              itemStyle: { color: color('series') },
              areaStyle: { color: color('series'), opacity: 0.12 },
            },
          ],
        })
        renderGraph()
      }
      const syncMotion = () => {
        graph?.setOption({ animation: !reduced.matches })
        traffic?.setOption({ animation: !reduced.matches })
      }
      try {
        const [{ register }, echarts, { createIcons, icons }] =
          await Promise.all([
            import('@datav-kit/elements'),
            import('echarts'),
            import('lucide'),
          ])
        register()
        await document.querySelector('dvk-fit-screen').updateComplete
        await new Promise(requestAnimationFrame)
        for (const el of screen.querySelectorAll('*')) {
          if (
            el.localName.startsWith('dvk-') &&
            !customElements.get(el.localName)
          )
            throw new Error(`Unregistered ${el.localName}`)
        }
        createIcons({ icons })
        const online = devices.filter((d) => d.state !== 'offline')
        document.querySelector('#online-count').textContent = online.length
        document.querySelector('#device-count').textContent =
          `/ ${devices.length} 台`
        document.querySelector('#health-summary').textContent =
          `${((online.length / devices.length) * 100).toFixed(1)}% 在线率`
        document.querySelector('#link-count').textContent =
          `${links.filter((link) => link[2] !== null).length} / ${links.length}`
        document.querySelector('#attention-count').textContent = devices.filter(
          (d) => d.state !== 'normal',
        ).length
        document.querySelector('#average-load').textContent =
          `${(online.reduce((sum, d) => sum + d.load, 0) / online.length).toFixed(1)}%`
        const select = document.querySelector('#device-select')
        devices.forEach((d) => {
          const option = document.createElement('option')
          option.value = d.id
          option.textContent = `${d.name} / ${labels[d.state]}`
          select.append(option)
        })
        graph = echarts.init(document.querySelector('#network-chart'), null, {
          renderer: 'svg',
        })
        traffic = echarts.init(document.querySelector('#traffic-chart'), null, {
          renderer: 'svg',
        })
        graph.on('click', (event) => {
          if (event.dataType === 'node') selectDevice(event.data.id)
        })
        select.addEventListener('change', () => selectDevice(select.value))
        screen
          .querySelectorAll('[data-alert]')
          .forEach((button) =>
            button.addEventListener('click', () =>
              selectDevice(button.dataset.alert),
            ),
          )
        screen.querySelectorAll('[data-filter]').forEach((button) =>
          button.addEventListener('click', () => {
            filter = button.dataset.filter
            renderGraph()
          }),
        )
        selectDevice(selected)
        setState(params.get('state'))
        document.querySelector('#retry').addEventListener('click', () => {
          setState('loading')
          retryTimer = setTimeout(() => {
            selectDevice(selected)
            setState('ready')
          }, 400)
        })
        observer = new ResizeObserver(() => {
          cancelAnimationFrame(resizeFrame)
          resizeFrame = requestAnimationFrame(() => {
            graph.resize()
            traffic.resize()
          })
        })
        observer.observe(document.querySelector('#network-chart'))
        observer.observe(document.querySelector('#traffic-chart'))
        reduced.addEventListener('change', syncMotion)
        screen.dataset.ready = 'true'
      } catch (error) {
        setState('failed')
        document.querySelector('#state-message').textContent =
          '依赖加载失败，请联网后重新打开'
        document.querySelector('#retry').onclick = () => location.reload()
        screen.dataset.ready = 'error'
        console.error(error)
      }
      addEventListener(
        'pagehide',
        () => {
          observer?.disconnect()
          cancelAnimationFrame(resizeFrame)
          clearTimeout(retryTimer)
          reduced.removeEventListener('change', syncMotion)
          graph?.dispose()
          traffic?.dispose()
        },
        { once: true },
      )
    </script>
  </body>
</html>
