<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="滨江空间态势：全幅地图、监测图层、区域选择与事件联动。"
    />
    <title>滨江空间 · 实时态势</title>
    <script type="importmap">
      {
        "imports": {
          "@datav-kit/elements": "https://cdn.jsdelivr.net/npm/@datav-kit/elements@0.0.5/+esm",
          "echarts": "https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.esm.min.js",
          "d3-geo": "https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm",
          "lucide": "https://cdn.jsdelivr.net/npm/lucide@0.468.0/+esm"
        }
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #171722;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        border: 0;
        background: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      button:disabled {
        cursor: default;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      [role='button']:focus-visible {
        outline: 3px solid var(--app-selected);
        outline-offset: 4px;
      }
      svg {
        display: block;
      }
      button svg {
        width: 24px;
        height: 24px;
      }
      [hidden] {
        display: none !important;
      }
      #screen {
        --app-background: #171722;
        --app-surface: #222232;
        --app-text: #f0f2fa;
        --app-muted: #b7b8cd;
        --app-rule: #494961;
        --app-selected: #77dfed;
        --app-positive: #a2e0bb;
        --app-warning: #f2c17c;
        --app-danger: #f79caa;
        --app-water: #263c50;
        --app-park: #293b3c;
        --app-building: #414159;
        --app-road: #8b8ba7;
        --app-series: #b4a2df;
        --dvk-color-primary: #77dfed;
        --dvk-color-secondary: #b4a2df;
        --dvk-count-to-color: var(--app-text);
        --dvk-count-to-font-size: 64px;
        width: 1920px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        background: var(--app-background);
        color: var(--app-text);
        font:
          21px/1.5 'Inter',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .screen-header {
        height: 116px;
        padding: 26px 44px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--app-rule);
      }
      .identity {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .identity > svg {
        width: 40px;
        height: 40px;
        color: var(--app-selected);
      }
      h1 {
        font-size: 34px;
        font-weight: 600;
      }
      .eyebrow {
        font-size: 15px;
        color: var(--app-muted);
      }
      .header-meta {
        display: flex;
        align-items: center;
        gap: 38px;
        font-size: 18px;
      }
      #status {
        color: var(--app-positive);
      }
      [data-state='stale'] #status {
        color: var(--app-warning);
      }
      main {
        position: absolute;
        inset: 116px 0 42px;
      }
      .map-stage {
        position: absolute;
        inset: 0;
      }
      #spatial-map {
        width: 100%;
        height: 100%;
      }
      .water {
        fill: var(--app-water);
      }
      .park {
        fill: var(--app-park);
      }
      .building {
        fill: var(--app-building);
        stroke: var(--app-road);
        stroke-width: 0.3;
      }
      .road {
        fill: none;
        stroke: var(--app-road);
        stroke-opacity: 0.65;
      }
      .zone-marker {
        cursor: pointer;
      }
      .zone-marker circle {
        fill: var(--app-surface);
        stroke: var(--app-selected);
        stroke-width: 3;
      }
      .zone-marker text {
        fill: var(--app-text);
        paint-order: stroke;
        stroke: var(--app-background);
        stroke-width: 6;
        font-size: 24px;
        font-weight: 600;
      }
      .zone-marker.selected circle {
        fill: var(--app-selected);
        stroke: var(--app-text);
        stroke-width: 4;
      }
      .sensor {
        fill: var(--app-positive);
        stroke: var(--app-background);
        stroke-width: 2;
      }
      .sensor.warning {
        fill: var(--app-warning);
      }
      .map-caption {
        position: absolute;
        left: 460px;
        top: 30px;
        color: var(--app-muted);
        font-size: 17px;
      }
      .map-caption strong {
        display: block;
        color: var(--app-text);
        font-size: 24px;
        font-weight: 500;
      }
      .overview {
        position: absolute;
        left: 44px;
        top: 30px;
        width: 352px;
        padding: 26px 26px 20px;
        background: var(--app-surface);
        border-left: 3px solid var(--app-selected);
      }
      .overview h2 {
        font-size: 27px;
        font-weight: 500;
        margin: 10px 0 6px;
      }
      .overview .caption {
        font-size: 16px;
        color: var(--app-muted);
      }
      .large-value {
        height: 92px;
        display: flex;
        gap: 12px;
        align-items: baseline;
        margin: 12px 0 4px;
        font-variant-numeric: tabular-nums;
      }
      .large-value span {
        color: var(--app-muted);
        font-size: 18px;
      }
      .stats {
        display: flex;
        gap: 28px;
        border-top: 1px solid var(--app-rule);
        padding-top: 20px;
      }
      .stats p {
        font-size: 16px;
        color: var(--app-muted);
      }
      .stats strong {
        font-size: 31px;
        font-weight: 500;
        color: var(--app-text);
      }
      .stats .warning {
        color: var(--app-warning);
      }
      .zones {
        display: grid;
        margin-top: 22px;
        gap: 4px;
      }
      .zones button {
        justify-content: space-between;
        padding: 12px 0;
        border-top: 1px solid var(--app-rule);
        font-size: 19px;
      }
      .zones button span {
        color: var(--app-muted);
        font-size: 16px;
      }
      .zones button[aria-pressed='true'] {
        color: var(--app-selected);
      }
      .layers {
        position: absolute;
        top: 30px;
        right: 44px;
        width: 264px;
        background: var(--app-surface);
        padding: 22px 24px;
        border-top: 2px solid var(--app-series);
      }
      .layers h2 {
        font-size: 21px;
        font-weight: 500;
        margin-bottom: 12px;
      }
      .layers label {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 0;
        font-size: 18px;
        cursor: pointer;
      }
      .layers input {
        accent-color: var(--app-selected);
        width: 19px;
        height: 19px;
        margin: 0;
      }
      .map-controls {
        position: absolute;
        right: 44px;
        top: 328px;
        display: flex;
        gap: 8px;
      }
      .map-controls button {
        width: 56px;
        height: 56px;
        background: var(--app-surface);
        border: 1px solid var(--app-rule);
      }
      .legend {
        position: absolute;
        left: 460px;
        bottom: 192px;
        display: flex;
        gap: 28px;
        font-size: 16px;
        color: var(--app-text);
        background: var(--app-background);
        padding: 8px 14px;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .legend i {
        width: 10px;
        height: 10px;
        background: var(--app-positive);
        border-radius: 50%;
      }
      .legend span:last-child i {
        background: var(--app-warning);
        border-radius: 0;
      }
      .bottom-band {
        position: absolute;
        left: 44px;
        right: 44px;
        bottom: 20px;
        height: 152px;
        display: grid;
        grid-template-columns: 1fr 1fr 520px;
        gap: 34px;
        padding: 18px 0 0;
        border-top: 1px solid var(--app-rule);
        background: var(--app-background);
      }
      .event {
        border-left: 3px solid var(--app-warning);
        padding-left: 20px;
      }
      .event h3 {
        font-size: 23px;
        font-weight: 500;
        margin: 7px 0;
      }
      .event p,
      .event time {
        font-size: 16px;
        color: var(--app-muted);
      }
      .event .event-state {
        font-size: 16px;
        color: var(--app-warning);
      }
      .flow-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 16px;
      }
      .flow-head h2 {
        font-size: 20px;
        font-weight: 500;
      }
      #flow-chart {
        height: 100px;
        width: 100%;
      }
      footer {
        position: absolute;
        height: 42px;
        bottom: 0;
        left: 44px;
        right: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        color: var(--app-muted);
      }
      footer a {
        color: var(--app-muted);
      }
      .state-layer {
        position: absolute;
        inset: 116px 0 42px;
        background: var(--app-background);
        display: none;
        place-content: center;
        text-align: center;
        gap: 18px;
      }
      .state-layer h2 {
        font-size: 32px;
      }
      .state-layer p {
        color: var(--app-muted);
      }
      .state-layer button {
        padding: 14px;
        color: var(--app-selected);
        justify-self: center;
      }
      #screen:is(
          [data-state='loading'],
          [data-state='empty'],
          [data-state='failed']
        )
        main {
        visibility: hidden;
      }
      #screen:is(
          [data-state='loading'],
          [data-state='empty'],
          [data-state='failed']
        )
        .state-layer {
        display: grid;
      }
    </style>
  </head>
  <body>
    <dvk-fit-screen
      width="1920"
      height="1080"
      mode="contain"
      align="center center"
    >
      <div
        id="screen"
        class="dvk-screen"
        data-state="loading"
        data-scene="spatial"
        data-layout="map-floating-overlays"
        data-palette="violet-cyan"
      >
        <header class="screen-header">
          <div class="identity">
            <i data-lucide="scan-line"></i>
            <div>
              <h1>滨江空间 · 实时态势</h1>
              <p class="eyebrow">RIVERFRONT / SPATIAL INTELLIGENCE</p>
            </div>
          </div>
          <div class="header-meta">
            <span>上海 · 黄浦江沿岸</span><span id="status">正在加载</span
            ><time>2026.09.09 14:30:00</time>
          </div>
        </header>
        <main>
          <div class="map-stage" data-primary-visual>
            <svg
              id="spatial-map"
              viewBox="0 0 1920 922"
              aria-label="上海滨江监测地图"
            >
              <g id="map-content">
                <g id="base-map"></g>
                <g id="sensors"></g>
                <g id="markers"></g>
              </g>
            </svg>
          </div>
          <p class="map-caption">
            <strong>黄浦江 · 两岸监测网</strong>31.237° N / 121.499° E
          </p>
          <section class="overview" aria-label="选中区域">
            <p class="eyebrow">区域实时客流 / 人</p>
            <h2 id="zone-name"></h2>
            <p class="caption" id="zone-description"></p>
            <div class="large-value">
              <dvk-count-to id="visitors" disabled></dvk-count-to
              ><span>人</span>
            </div>
            <div class="stats">
              <div>
                <p>在线监测点</p>
                <strong id="online"></strong>
              </div>
              <div>
                <p>待处理事件</p>
                <strong class="warning" id="event-count"></strong>
              </div>
            </div>
            <div class="zones" role="group" aria-label="监测区域">
              <button data-zone="bund" aria-pressed="false">
                外滩片区<span>西岸</span>
              </button>
              <button data-zone="river" aria-pressed="true">
                滨江片区<span>东岸 · 北段</span>
              </button>
              <button data-zone="finance" aria-pressed="false">
                金融城<span>东岸 · 南段</span>
              </button>
            </div>
          </section>
          <section class="layers" aria-label="地图图层">
            <h2>监测图层</h2>
            <label
              ><input
                type="checkbox"
                data-layer="building"
                checked
              />建筑轮廓</label
            >
            <label
              ><input
                type="checkbox"
                data-layer="road"
                checked
              />道路网络</label
            >
            <label
              ><input
                type="checkbox"
                data-layer="sensors"
                checked
              />监测点位</label
            >
          </section>
          <div class="map-controls" role="group" aria-label="地图视角">
            <button id="zoom-in" aria-label="放大地图" title="放大地图">
              <i data-lucide="plus"></i>
            </button>
            <button id="zoom-out" aria-label="缩小地图" title="缩小地图">
              <i data-lucide="minus"></i>
            </button>
            <button id="reset-map" aria-label="复位地图" title="复位地图">
              <i data-lucide="locate-fixed"></i>
            </button>
          </div>
          <div class="legend">
            <span><i></i>监测正常</span><span><i></i>待复核点位</span>
          </div>
          <div class="bottom-band">
            <article class="event">
              <time id="event-time"></time>
              <h3 id="event-title"></h3>
              <p id="event-location"></p>
            </article>
            <article class="event">
              <span class="event-state">巡查调度</span>
              <h3 id="team-count"></h3>
              <p id="team-note"></p>
            </article>
            <section class="flow">
              <div class="flow-head">
                <h2>客流变化</h2>
                <span>07:00 - 14:00 · 人</span>
              </div>
              <div id="flow-chart" data-chart aria-label="区域小时客流"></div>
            </section>
          </div>
        </main>
        <footer>
          <span>监测点位与运行指标为演示数据 · 更新于 14:30</span
          ><a href="https://www.openstreetmap.org/copyright"
            >© OpenStreetMap contributors · ODbL</a
          >
        </footer>
        <section class="state-layer" role="status">
          <h2 id="state-title">正在加载空间态势</h2>
          <p id="state-message"></p>
          <button id="retry" hidden>
            <i data-lucide="refresh-cw"></i>重新加载
          </button>
        </section>
      </div>
    </dvk-fit-screen>

    <script type="module">
      const screen = document.querySelector('#screen')
      const params = new URLSearchParams(location.search)
      const reduced = matchMedia('(prefers-reduced-motion: reduce)')
      const color = (role) =>
        getComputedStyle(screen).getPropertyValue(`--app-${role}`).trim()
      const zones = {
        bund: {
          name: '外滩片区',
          description: '历史风貌区 / 滨水步道',
          point: [121.4907, 31.2382],
          online: 42,
          total: 44,
          teams: 12,
          flow: [810, 1280, 1710, 1930, 1640, 1800, 2320, 2680],
          event: ['14:26', '滨水步道客流偏高', '中山东一路 · 步道入口'],
          pending: 2,
        },
        river: {
          name: '滨江片区',
          description: '文化休闲带 / 开放空间',
          point: [121.5012, 31.2421],
          online: 35,
          total: 36,
          teams: 9,
          flow: [620, 870, 1150, 1280, 1490, 1720, 2010, 2290],
          event: ['14:24', '滨江入口短时拥堵', '丰和路 · 停车场入口'],
          pending: 1,
        },
        finance: {
          name: '金融城',
          description: '商务楼宇群 / 核心办公区',
          point: [121.5055, 31.2324],
          online: 58,
          total: 60,
          teams: 16,
          flow: [1420, 2710, 2230, 1980, 2460, 2310, 1890, 2010],
          event: ['14:27', '地下通道积水预警', '银城中路 · 地下通道'],
          pending: 2,
        },
      }
      let chart,
        observer,
        resizeFrame,
        retryTimer,
        zoom = 1
      function setState(value) {
        const state = ['loading', 'empty', 'failed', 'stale'].includes(value)
          ? value
          : 'ready'
        screen.dataset.state = state
        document.querySelector('#status').textContent = {
          ready: '监测数据已同步',
          loading: '正在加载',
          empty: '暂无数据',
          failed: '同步失败',
          stale: '数据已过期 · 保留上次结果',
        }[state]
        document.querySelector('#state-title').textContent =
          {
            loading: '正在加载空间态势',
            empty: '当前区域暂无数据',
            failed: '空间态势加载失败',
          }[state] || ''
        document.querySelector('#state-message').textContent =
          '上海滨江 · 2026.09.09 14:30'
        document.querySelector('#retry').hidden = !['empty', 'failed'].includes(
          state,
        )
        screen.querySelectorAll('main button, main input').forEach((el) => {
          el.disabled = !['ready', 'stale'].includes(state)
        })
      }
      function selectZone(key) {
        const zone = zones[key]
        screen.dataset.zone = key
        screen.dataset.total = zone.flow.at(-1)
        document.querySelector('#zone-name').textContent = zone.name
        document.querySelector('#zone-description').textContent =
          zone.description
        document
          .querySelector('#visitors')
          .setAttribute('end-val', zone.flow.at(-1))
        document.querySelector('#online').textContent =
          `${zone.online} / ${zone.total}`
        document.querySelector('#event-count').textContent = zone.pending
        document.querySelector('#event-time').textContent =
          `${zone.event[0]} · 待处置`
        document.querySelector('#event-title').textContent = zone.event[1]
        document.querySelector('#event-location').textContent = zone.event[2]
        document.querySelector('#team-count').textContent =
          `${zone.teams} 支队伍 · ${zone.teams * 3} 人在岗`
        document.querySelector('#team-note').textContent =
          `${zone.name} · ${zone.total - zone.online} 处点位待复核`
        screen.querySelectorAll('[data-zone]').forEach((el) => {
          const selected = el.dataset.zone === key
          el.setAttribute('aria-pressed', String(selected))
          el.classList.toggle('selected', selected)
        })
        chart.setOption({
          animation: !reduced.matches,
          animationDuration: 250,
          grid: { top: 12, left: 4, right: 14, bottom: 22 },
          xAxis: {
            type: 'category',
            data: zone.flow.map((_, i) => `${i + 7}:00`),
            axisLine: { show: false },
            axisTick: { show: false },
            axisLabel: { color: color('muted'), fontSize: 13 },
          },
          yAxis: { type: 'value', show: false, min: 0 },
          tooltip: {
            trigger: 'axis',
            backgroundColor: color('surface'),
            textStyle: { color: color('text') },
            borderColor: color('rule'),
          },
          series: [
            {
              type: 'bar',
              data: zone.flow,
              barWidth: 18,
              itemStyle: { color: color('selected') },
            },
          ],
        })
      }
      function setZoom(value) {
        zoom = Math.max(1, Math.min(2, value))
        document
          .querySelector('#map-content')
          .setAttribute(
            'transform',
            `translate(1080,400) scale(${zoom}) translate(-1080,-400)`,
          )
        screen.dataset.zoom = zoom.toFixed(2)
      }
      const syncMotion = () => chart?.setOption({ animation: !reduced.matches })
      try {
        const [{ register }, geo, echarts, { createIcons, icons }] =
          await Promise.all([
            import('@datav-kit/elements'),
            import('d3-geo'),
            import('echarts'),
            import('lucide'),
          ])
        register()
        await document.querySelector('dvk-fit-screen').updateComplete
        await new Promise(requestAnimationFrame)
        for (const el of screen.querySelectorAll('*')) {
          if (
            el.localName.startsWith('dvk-') &&
            !customElements.get(el.localName)
          )
            throw new Error(`Unregistered ${el.localName}`)
        }
        createIcons({ icons })
        const geography = JSON.parse(
          document.querySelector('#geography').textContent,
        )
        const projection = geo.geoMercator().fitExtent(
          [
            [440, 46],
            [1630, 710],
          ],
          {
            type: 'LineString',
            coordinates: [
              [121.486, 31.228],
              [121.509, 31.246],
            ],
          },
        )
        const path = geo.geoPath(projection)
        const ns = 'http://www.w3.org/2000/svg'
        for (const feature of geography.features) {
          const el = document.createElementNS(ns, 'path')
          el.setAttribute('d', path(feature))
          el.setAttribute('class', feature.properties.kind)
          if (feature.properties.kind === 'road')
            el.setAttribute(
              'stroke-width',
              feature.properties.major ? '2' : '.8',
            )
          document.querySelector('#base-map').append(el)
        }
        for (const [key, zone] of Object.entries(zones)) {
          const [x, y] = projection(zone.point)
          const marker = document.createElementNS(ns, 'g')
          marker.setAttribute('transform', `translate(${x},${y})`)
          marker.setAttribute('class', 'zone-marker')
          marker.setAttribute('role', 'button')
          marker.setAttribute('tabindex', '0')
          marker.setAttribute('aria-label', `地图选区：${zone.name}`)
          marker.dataset.zone = key
          marker.innerHTML = `<circle r="13"></circle><text x="24" y="-18">${zone.name}</text>`
          marker.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault()
              selectZone(key)
            }
          })
          document.querySelector('#markers').append(marker)
          for (let i = 0; i < zone.total; i++) {
            const warning = i < zone.total - zone.online
            const radius = Math.sqrt((i + 1) / zone.total)
            const dot = document.createElementNS(
              ns,
              warning ? 'rect' : 'circle',
            )
            const [dx, dy] = projection([
              zone.point[0] + Math.cos(i * 2.4) * 0.0026 * radius,
              zone.point[1] + Math.sin(i * 2.4) * 0.0018 * radius,
            ])
            dot.dataset.sensorZone = key
            dot.setAttribute('class', `sensor${warning ? ' warning' : ''}`)
            if (warning) {
              dot.setAttribute('x', dx - 5)
              dot.setAttribute('y', dy - 5)
              dot.setAttribute('width', 10)
              dot.setAttribute('height', 10)
            } else {
              dot.setAttribute('cx', dx)
              dot.setAttribute('cy', dy)
              dot.setAttribute('r', 4)
            }
            document.querySelector('#sensors').append(dot)
          }
        }
        chart = echarts.init(document.querySelector('#flow-chart'), null, {
          renderer: 'svg',
        })
        screen
          .querySelectorAll('[data-zone]')
          .forEach((el) =>
            el.addEventListener('click', () => selectZone(el.dataset.zone)),
          )
        screen.querySelectorAll('[data-layer]').forEach((input) =>
          input.addEventListener('change', () => {
            const selector =
              input.dataset.layer === 'sensors'
                ? '#sensors'
                : `#base-map .${input.dataset.layer}`
            screen.querySelectorAll(selector).forEach((el) => {
              el.style.display = input.checked ? '' : 'none'
            })
          }),
        )
        document
          .querySelector('#zoom-in')
          .addEventListener('click', () => setZoom(zoom + 0.25))
        document
          .querySelector('#zoom-out')
          .addEventListener('click', () => setZoom(zoom - 0.25))
        document
          .querySelector('#reset-map')
          .addEventListener('click', () => setZoom(1))
        selectZone('river')
        setZoom(1)
        setState(params.get('state'))
        document.querySelector('#retry').addEventListener('click', () => {
          setState('loading')
          retryTimer = setTimeout(() => {
            selectZone(screen.dataset.zone)
            setState('ready')
          }, 400)
        })
        observer = new ResizeObserver(() => {
          cancelAnimationFrame(resizeFrame)
          resizeFrame = requestAnimationFrame(() => chart.resize())
        })
        observer.observe(document.querySelector('#flow-chart'))
        reduced.addEventListener('change', syncMotion)
        screen.dataset.ready = 'true'
      } catch (error) {
        setState('failed')
        document.querySelector('#state-message').textContent =
          '依赖加载失败，请联网后重新打开'
        document.querySelector('#retry').onclick = () => location.reload()
        screen.dataset.ready = 'error'
        console.error(error)
      }
      addEventListener(
        'pagehide',
        () => {
          observer?.disconnect()
          cancelAnimationFrame(resizeFrame)
          clearTimeout(retryTimer)
          reduced.removeEventListener('change', syncMotion)
          chart?.dispose()
        },
        { once: true },
      )
