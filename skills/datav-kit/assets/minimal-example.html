<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataV Kit · Minimal Screen</title>
    <script type="importmap">
      {
        "imports": {
          "@datav-kit/elements": "https://cdn.jsdelivr.net/npm/@datav-kit/elements@0.0.5/+esm"
        }
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14232b;
      }
      .dvk-screen {
        --dvk-color-primary: #7db5c9;
        --dvk-color-secondary: #8bd2ba;
        --dvk-color-surface: #1e333d;
        --dvk-count-to-color: #edf5f7;
        --dvk-count-to-font-size: 96px;
        width: 1920px;
        height: 1080px;
        padding: 96px;
        color: #edf5f7;
        background: #14232b;
        font:
          28px/1.5 'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }
      h1 {
        margin: 0 0 64px;
        font-size: 48px;
        font-weight: 500;
      }
      dvk-border-box-15 {
        display: block;
        width: 760px;
        height: 360px;
      }
      .metric {
        height: 100%;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .metric p {
        margin: 0;
        color: #b3c8d2;
      }
      #error {
        color: #ffc59e;
      }
    </style>
  </head>
  <body>
    <dvk-fit-screen
      width="1920"
      height="1080"
      mode="contain"
      align="center center"
    >
      <div class="dvk-screen dvk-theme-minimal" id="screen">
        <h1>生产运行总览</h1>
        <dvk-border-box-15 background-color="var(--dvk-color-surface)">
          <section class="metric">
            <p>本班累计产量 / 件</p>
            <dvk-count-to end-val="3912" disabled></dvk-count-to>
          </section>
        </dvk-border-box-15>
        <p id="error" role="status"></p>
      </div>
    </dvk-fit-screen>
    <script type="module">
      try {
        const { register } = await import('@datav-kit/elements')
        register()
        await document.querySelector('dvk-fit-screen').updateComplete
        document.querySelector('#screen').dataset.ready = 'true'
      } catch (error) {
        document.querySelector('#error').textContent =
          '依赖加载失败，请联网后重新打开。'
        document.querySelector('#screen').dataset.ready = 'error'
        console.error(error)
      }
    </script>
  </body>
</html>
